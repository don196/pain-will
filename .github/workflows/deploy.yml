# Сборка, проверка и выкладка полигона.
# Пулл-реквест: сборка, браузерные проверки и таблица баланса в сводке запуска.
# Обновление main: то же самое и выкладка на GitHub Pages.
name: Сборка и выкладка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Сборка
        run: npm run build
      - name: Браузер для проверок
        run: npx playwright install --with-deps chromium
      - name: Проверки в браузере
        run: npm test
      - name: Регрессия заключённых и карт тюремного блока
        run: node tests/prisoners.mjs
      - name: Баланс (симуляции)
        run: npm run sim -- --n 300 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Солдаты 3 на 3 — ровно 100 повторений
        run: npm run sim -- --n 100 --scn soldiers3v3 --seed 20261123 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Заключённые тюремного блока — 100 боёв на карту
        run: npm run sim -- --n 100 --scn prison33,prison34 --seed 20261123 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Пакет для Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Выкладка на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
