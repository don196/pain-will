<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон подземелья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
:root{
  /* Подземелье при свече: закопчённый камень, сальный свет, окись меди — герои, ржавчина — враги.
     Раскладка: слева ход и карточка бойца, в центре поле с освещением, справа журнал бросков. */
  --soot:#121010; --stone:#1c1816; --stone-2:#28221e; --line:#3a322b;
  --tallow:#e6d7b6; --tallow-dim:#a69a83; --ember:#e0903f; --copper:#74a896; --rust:#c04a33;
  --good:#86b46c; --warn:#d9a441; --bad:#cf553f;
  --display:"Ruslan Display","Alegreya SC",Georgia,serif;
  --sc:"Alegreya SC",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --cell:46px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--soot);color:var(--tallow);font:15px/1.42 var(--body)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#1b1715,#141110)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:27px;letter-spacing:.03em;margin:0;text-wrap:balance}
.brand .sub{font-family:var(--sc);font-size:14px;color:var(--tallow-dim);letter-spacing:.05em}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.controls label{font-family:var(--sc);font-size:14px;color:var(--tallow-dim)}
button,select,input{font:inherit;font-size:14px;color:var(--tallow);background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
button,select{cursor:pointer}
input[type=number]{width:58px;padding:3px 5px;font-family:var(--mono);font-size:13px}
button:hover:not(:disabled),select:hover{border-color:#7a5a3a}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:#3b2513;border-color:#80502a;color:#f6dfb8}
button.primary:hover:not(:disabled){background:#4a2e16;border-color:var(--ember)}
button.on{background:#3b2513;border-color:var(--ember)}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr) 350px;min-height:0}
aside{min-height:0;overflow:auto;background:var(--stone)}
aside.left{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
aside.right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.center{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px 12px 8px;gap:8px}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
#board{position:relative;flex:none;box-shadow:0 0 0 1px #000,0 24px 60px rgba(0,0,0,.65);border-radius:2px}
#board canvas{position:absolute;left:0;top:0;pointer-events:none}
#hl{position:absolute;left:0;top:0;overflow:visible}
#hl .c{fill:transparent;stroke:none;pointer-events:all;transition:fill .08s}
#hl .c.mv1{fill:rgba(116,168,150,.24);stroke:rgba(116,168,150,.55);stroke-width:1;cursor:pointer}
#hl .c.mv2{fill:rgba(116,168,150,.1);stroke:rgba(116,168,150,.28);stroke-width:1;cursor:pointer}
#hl .c.rng{fill:rgba(224,144,63,.09)}
#hl .c.path{fill:rgba(224,144,63,.38)}
#hl .c.tgt{fill:rgba(224,144,63,.16);stroke:var(--ember);stroke-width:2;cursor:crosshair}
#hl .c.ally{stroke:var(--copper);stroke-width:2;cursor:pointer}
#hl .c.arcpick{stroke:rgba(192,74,51,.8);stroke-width:1.2;cursor:crosshair}
#hl .c.arc{fill:rgba(192,74,51,.38)}
#hl .c.ed{cursor:cell}
#hl .c.ed:hover{stroke:var(--tallow);stroke-width:2}
#toks,#fx{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .09s linear}
.tok .disc{position:absolute;inset:13%;border-radius:50%;display:grid;place-items:center;font-family:var(--sc);font-weight:700;font-size:calc(var(--cell)*.34);line-height:1;box-shadow:0 3px 7px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.tok.big .disc{inset:5%;font-size:calc(var(--cell)*.42)}
.tok.s2{width:calc(var(--cell)*1.8);height:calc(var(--cell)*1.8)}
.tok.s2 .disc{inset:7%;font-size:calc(var(--cell)*.7)}
.tok.s2 .hp{height:6px}
.tok .od b.ad{background:#74a896}
.tok.pc .disc{background:radial-gradient(circle at 35% 30%,#9ccbb9,#457465 58%,#203d36);color:#0b1714;border:2px solid #b3dccb}
.tok.en .disc{background:radial-gradient(circle at 35% 30%,#d8705a,#842a1a 58%,#40110a);color:#f7dccb;border:2px solid #e8957a}
.tok.sel .disc{box-shadow:0 0 0 3px var(--ember),0 0 20px rgba(224,144,63,.75)}
.tok.down{opacity:.32;filter:grayscale(1)}
.tok.down .disc::after{content:"✝";position:absolute;font-size:calc(var(--cell)*.5);color:#ddd}
.tok .hp{position:absolute;left:14%;right:14%;bottom:3%;height:4px;background:#000;border-radius:2px;overflow:hidden}
.tok .hp i{display:block;height:100%}
.tok .bd{position:absolute;top:-3px;right:-4px;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:70%;gap:0;font-size:calc(var(--cell)*.25);line-height:1;filter:drop-shadow(0 1px 1px #000)}
.tok .od{position:absolute;left:1px;top:1px;display:flex;gap:2px}
.tok .od b{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 1px #000}
.tok .od b.off{background:#3a322b}
.tok.hit .disc{animation:hit .38s}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.86);filter:brightness(2.2)}100%{transform:scale(1)}}
.fxt{position:absolute;font-family:var(--mono);font-weight:600;font-size:15px;text-shadow:0 1px 2px #000,0 0 6px #000;animation:rise 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.fxt.dmg{color:#ff8a6b}.fxt.miss{color:var(--tallow-dim)}.fxt.info{color:var(--warn)}.fxt.heal{color:var(--good)}
@keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-30px}}
.fxl{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;animation:fade .5s ease-out forwards}
.fxl.fire{background:linear-gradient(90deg,rgba(255,180,80,0),#ffb050 70%,#fff2c0)}
.fxl.bolt{background:linear-gradient(90deg,rgba(220,220,200,0),#ddd 80%)}
.fxl.melee{background:linear-gradient(90deg,rgba(255,120,90,0),#ff7a5a)}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,7,.55);pointer-events:auto}
.banner .bx{background:var(--stone);border:1px solid var(--line);padding:22px 28px;text-align:center;box-shadow:0 20px 60px #000}
.banner h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tallow-dim);justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px;border-radius:2px}
h2.ph{font-family:var(--sc);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--tallow-dim);margin:0 0 6px;text-transform:none}
.panel{background:var(--stone-2);border:1px solid var(--line);border-radius:5px;padding:10px}
.turn .rnd{font-family:var(--sc);font-size:21px;line-height:1.1}
.turn .who{font-size:14px;color:var(--tallow-dim);margin:2px 0 8px}
.turn .init{font-size:12.5px;color:var(--tallow-dim);margin-top:8px}
.turn .row{display:flex;gap:6px;flex-wrap:wrap}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card .gl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--sc);font-weight:700;font-size:16px;flex:none}
.card .gl.pc{background:#457465;color:#0b1714;border:2px solid #b3dccb}
.card .gl.en{background:#842a1a;color:#f7dccb;border:2px solid #e8957a}
.card .nm{font-family:var(--sc);font-size:18px;line-height:1.1}
.card .sd{font-size:12.5px;color:var(--tallow-dim)}
.bar{height:8px;background:#0b0908;border-radius:4px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.kv dt{color:var(--tallow-dim)}
.kv dd{margin:0;font-size:13.5px}
.kv dd b{font-family:var(--mono);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
.stats div{background:#16130f;border:1px solid var(--line);border-radius:4px;text-align:center;padding:3px 0}
.stats b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.stats span{font-size:11.5px;color:var(--tallow-dim)}
.stats .low b{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);background:#16130f;white-space:nowrap}
.chip.crit{background:#5b3410;border-color:var(--ember);color:#ffd9a0}
.chip.enh{background:#2f4420;border-color:#7da35d;color:#d6f0bf}
.chip.ok{background:#22311b;border-color:#58773f;color:#cfe5bb}
.chip.minor{color:var(--tallow-dim)}
.chip.fail{background:#3a1712;border-color:#7a2d20;color:#f0b5a6}
.chip.cfail{background:#5a130b;border-color:var(--bad);color:#ffd0c4}
.chip.st{border-color:#5a4a3a}
.willrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:13.5px}
.willrow button{padding:1px 7px;font-family:var(--mono);font-size:12px}
.willrow select{padding:2px 4px;font-size:13px}
.dis{font-size:12.5px;color:var(--warn);margin-top:4px}
.acts{display:flex;flex-direction:column;gap:5px}
.act{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;align-items:center;text-align:left;padding:6px 8px}
.act .k{font-family:var(--mono);font-size:11px;color:var(--tallow-dim)}
.act .n{font-weight:500}
.act .c{display:flex;gap:3px}
.act .c b{width:8px;height:8px;border-radius:50%;background:var(--ember)}
.act .c b.z{background:transparent;border:1px solid var(--tallow-dim)}
.act .h{grid-column:2/4;font-size:12px;color:var(--tallow-dim);line-height:1.25}
.act .why{grid-column:2/4;font-size:12px;color:var(--warn)}
.act .pend,.pend{grid-column:2/4;font-size:11.5px;color:#c9a6e0;letter-spacing:.02em}
.pend::before{content:"⚑ "}
.act.sel{border-color:var(--ember);background:#3b2513}
.roster{display:flex;flex-direction:column;gap:3px}
.ru{display:grid;grid-template-columns:1fr 70px 46px;gap:8px;align-items:center;padding:3px 6px;border-radius:4px;background:transparent;border:1px solid transparent;text-align:left;font-size:13.5px}
.ru:hover{border-color:var(--line)}
.ru.sel{border-color:var(--ember)}
.ru.down{opacity:.4;text-decoration:line-through}
.ru .mb{height:5px;background:#0b0908;border-radius:3px;overflow:hidden}
.ru .mb i{display:block;height:100%}
.ru .hpn{font-family:var(--mono);font-size:12px;text-align:right}
.nm.pc{color:#a9d8c6}.nm.en{color:#f0a48c}
.loghead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.loghead h2{margin:0}
#log{flex:1;overflow:auto;padding:8px 12px 20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.le{line-height:1.35}
.le.atk{background:#16130f;border:1px solid #2c2520;border-left:3px solid #5a4632;border-radius:4px;padding:6px 8px}
.le .lh{font-weight:500}
.le .lr,.le .ld{font-family:var(--mono);font-size:12px;color:#cdbf9f;margin-top:2px}
.le .lr b,.le .ld b{color:#fff1d0}
.le .lo{margin-top:3px}
.le .dim,.dim{color:var(--tallow-dim)}
.le.sys .lb{font-family:var(--sc);color:var(--ember);font-size:14px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.le.ev{font-size:13px;padding-left:10px;border-left:2px solid #3a322b}
.le.mv{font-size:12.5px;color:var(--tallow-dim)}
.tip{position:fixed;z-index:30;max-width:300px;background:#0f0d0b;border:1px solid #5a4632;border-radius:5px;padding:8px 10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.7);pointer-events:none}
.tip b{color:#fff1d0}
.tip .m{font-family:var(--mono);font-size:12px;color:#cdbf9f}
.tip .big{font-family:var(--mono);font-size:18px;color:var(--ember)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,5,4,.72);display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.mbox{background:var(--stone);border:1px solid var(--line);border-radius:6px;max-width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px;box-shadow:0 24px 70px #000;width:100%}
.mbox.sm{max-width:520px}
.mbox h2{font-family:var(--sc);font-size:21px;margin:0 0 10px}
.mbox h3{font-family:var(--sc);font-size:16px;margin:16px 0 6px;color:var(--tallow-dim)}
.mbox p,.mbox li{max-width:72ch}
.mbox .x{float:right}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:grid;gap:4px}
.opt .lbl{font-weight:500}
.opt .note{font-size:12.5px;color:var(--tallow-dim)}
.opt .ch{display:flex;flex-wrap:wrap;gap:6px}
.opt .ch label{display:flex;gap:6px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:14px}
.opt .ch input{accent-color:var(--ember)}
.adopts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.adopts button{display:flex;justify-content:space-between;gap:14px;text-align:left}
.adopts .p{font-family:var(--mono);color:var(--ember)}
.odds{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.odds th,.odds td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.odds th{background:var(--stone-2);font-weight:500;position:sticky;top:0}
.odds th.rh{text-align:left;position:sticky;left:0;background:var(--stone-2);z-index:1}
.odds td .e{font-family:var(--mono);font-size:13px;display:block}
.odds td .h{font-size:11px;color:var(--tallow-dim)}
.tblwrap{overflow:auto;max-height:62vh;border:1px solid var(--line)}
.simres{font-variant-numeric:tabular-nums}
.simres .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.simres .big3 div{background:var(--stone-2);border:1px solid var(--line);border-radius:5px;padding:8px;text-align:center}
.simres .big3 b{display:block;font-family:var(--mono);font-size:24px}
.simres table{border-collapse:collapse;width:100%;font-size:13px}
.simres td,.simres th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.ed-tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ed-tools button.on{border-color:var(--ember);background:#3b2513}
.edrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13.5px}
.edstats{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-size:13px;margin-top:6px}
.help{font-size:12.5px;color:var(--tallow-dim)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#16130f}

.mbox.wide{max-width:min(1380px,100%)}
.tabs{display:flex;gap:4px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button.on{background:#3b2513;border-color:var(--ember)}
.dtab{border-collapse:collapse;font-size:13px}
.dtab th,.dtab td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:middle;white-space:nowrap}
.dtab th{background:var(--stone-2);position:sticky;top:0;z-index:1;font-weight:500}
.dtab .ni{width:50px}
.dtab .ti{width:124px;padding:3px 6px}
.dtab .gi{width:42px;padding:3px 4px;text-align:center}
.dtab select{padding:3px 4px;font-size:13px;max-width:160px}
.dtab td.der{font-family:var(--mono);color:var(--ember)}
.dtab th.der{color:var(--ember)}
.dtab tr:not(.wrow) td{border-bottom:0;padding-top:8px}
.dtab tr.wrow td{padding:0 5px 8px;white-space:normal}
.dtab tr.wrow select{max-width:none}
.wchip{display:inline-flex;align-items:center;background:#16130f;border:1px solid var(--line);border-radius:10px;padding:0 0 0 8px;margin:2px 3px 2px 0;font-size:12.5px}
.wchip button{border:0;background:transparent;padding:0 7px;font-size:14px;line-height:1.4;color:var(--tallow-dim)}
.wchip button:hover{color:var(--bad)}
.drow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.wcard{background:var(--stone-2);border:1px solid var(--line);border-radius:5px;padding:10px}
.wcard .wh{display:flex;gap:6px}
.wcard .wh .ti{flex:1;min-width:0;padding:4px 7px;font-weight:500}
.wcard .wk{font-size:12px;color:var(--tallow-dim);margin:5px 0 8px}
.wcard .wf{display:grid;grid-template-columns:1fr 108px;gap:4px 8px;align-items:center;font-size:13px}
.wcard .wf .ni{width:108px}
.wcard .wf select{padding:3px 4px;font-size:13px;width:108px}
.wcard .fb{grid-column:1/3;display:flex;gap:6px;align-items:center;cursor:pointer}
.wcard .fb input{accent-color:var(--ember)}
.wcard .wd{margin-top:8px;font-size:12px;color:#cdbf9f;font-family:var(--mono)}
#ioText{width:100%;font-family:var(--mono);font-size:12px;background:#0f0d0b;color:var(--tallow);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
@media (max-width:1180px){
  html,body{height:auto}
  .app{height:auto}
  .layout{grid-template-columns:1fr}
  .center{order:-1}
  aside.left{border-right:0;border-bottom:1px solid var(--line)}
  aside.right{border-left:0;max-height:460px}
  .board-wrap{flex:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Полигон подземелья</h1>
      <span class="sub">проверка боевых правил · рабочая редакция</span>
    </div>
    <div class="controls">
      <label for="scn">Сценарий</label>
      <select id="scn"></select>
      <button id="btnRestart" type="button">Сначала</button>
      <button id="btnEditor" type="button">Редактор поля</button>
      <button id="btnOdds" type="button">Таблица шансов</button>
      <button id="btnSim" type="button">Симуляция боёв</button>
      <button id="btnRules" type="button">Настройки правил</button>
      <button id="btnData" type="button">Персонажи и оружие</button>
      <button id="btnNotes" type="button">Допущения</button>
    </div>
  </header>
  <main class="layout">
    <aside class="left">
      <section class="panel turn" id="turn"></section>
      <section id="acts"></section>
      <section class="panel card" id="card"></section>
      <section class="panel"><h2 class="ph">Участники</h2><div class="roster" id="roster"></div></section>
    </aside>
    <section class="center">
      <div class="board-wrap" id="wrap">
        <div id="board">
          <canvas id="floor"></canvas>
          <canvas id="light"></canvas>
          <svg id="hl" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="toks"></div>
          <div id="fx"></div>
          <div id="banner" class="banner" hidden></div>
        </div>

const ATTACK_KINDS=['attack','arc','circle','grab'];
function hintOf(id,a){
  const r=n=>n===1?'раунд':n>=2&&n<=4?'раунда':'раундов';
  if(PAIN()&&id==='bandage')return `1 бинт = ${a.pts} пункта: по 1 на стак кровотечения, потом по 1 на открытую рану. Себе, соседу или соседу без сознания`;
  switch(id){
    case 'cover':return `Соседний союзник, ${a.dur} ${r(a.dur)}: перехват одной атаки (кроме площадных), если атакующий может с той же позиции атаковать и вас`;
    case 'vuln':return `Видимая цель: d20 + Интуиция против базовой защиты + Интуиции цели. −Интуиция / ${fmtN(a.K)} по степени к пассивной и активной защите, ${a.turns} хода цели; броня не меняется, повтор обновляет срок`;
    case 'cloud':return `Цель на виду: d20 + Интуиция против ${a.dc}. −Интуиция / ${fmtN(a.K)} по степени к атакам и способностям цели, ${a.turns} хода цели; повтор обновляет срок`;
    case 'throwTorch':return `Зажечь факел из запаса и бросить на пол в пределах ${a.range} кл. по линии видимости. Горит, пока не погасят`;
    case 'throwHeld':return `Горящий факел из рук — на пол в пределах ${a.range} кл. по линии видимости. Вы перестаёте быть носителем факела`;
    case 'bandage':return `1 бинт = ${a.pts} лечебных пункта: сначала по 1 на стак кровотечения, потом по 1 на открытую рану. Себе или соседу`;
    case 'limbGrab':return `${a.gdmg} урона сразу, ${a.gdmg} на следующем ходу, затем бросок о стену: ${a.gdmg} урона и перелом`;
    case 'jailerGrab':return `Цель не двигается и не защищается активно; ${a.gdmg} урона в каждый ход тюремщика`;
    case 'shriek':return `−${a.mag} Воли героям в радиусе ${a.radius}; нужно ≥${a.minT} героя рядом, перезарядка ${a.cd||0}`;
    case 'counter':return `До своего хода: успешный блок/парирование наносит атакующему рану руки с оружием (по правилам ран) и ${a.cdmg} урона сквозь броню`;
    case 'knifeExtra':return `HP ниже ${a.hpBelow}: одна дополнительная атака за ход без ОД`;
    case 'bind':return `Соседний враг: встречная Сила, ничья в пользу цели. Цель не двигается и не бьёт связанным оружием до вашего следующего хода, защита −${a.defPen}. Вы не атакуете, движение снимает Вязку. Перезарядка ${a.cd}${a.cdOnlySuccess?' — только после успеха':''}`;
    case 'blindlight':return `d20 + Интуиция против ${a.dc}: свет = Интуиция / ${fmtN(a.K)} по степени, ослепление на ${a.off} меньше (мин. 1): −${a.mag} к атакам всем, кроме вас, до вашего следующего хода`;
    case 'wrath':return `d20 + Интуиция + Харизма против ${a.dc}: урон Воле (Инт + Хар) / ${fmtN(a.K)} по степени врагам в радиусе ${a.radius}. Перезарядка ${a.cd}`;
    case 'inspire':return `Союзник в пределах ${a.range} кл.: d20 + Харизма против ${a.dc}, +Харизма / ${fmtN(a.K)} по степени ко всем броскам до конца его ${a.turns}-го хода; одна цель за раз`;
    case 'smash':return 'Соседняя клетка стены, двери или решётки разрушается сразу';
    case 'mend':return `Себе или соседу: d20 + Интуиция против ${a.dc}, пунктов = Интуиция / ${fmtN(a.K)} по степени. Пункт снимает стак кровотечения, затем закрывает открытую рану, затем смягчает закрытую серьёзную или тяжёлую рану на ступень. HP не лечит`;
    case 'psalm':return `Голос: d20 + Харизма против ${a.dc}. Союзникам в радиусе ${a.radius} (и себе) +Харизма / ${fmtN(a.K)} по степени к пассивной и активной защите до вашего хода. Сквозь стены. Перезарядка ${a.cd}`;
    case 'voice':return `Голос: d20 + Харизма против ${a.dc}. Каждому врагу в радиусе ${a.radius} урон Харизма / ${fmtN(a.K)} по степени, броня не защищает. Сквозь стены. Перезарядка ${a.cd}`;
    case 'mark':return `Видимая цель: d20 + Интуиция против ${a.dc}. Атаки всех героев по ней игнорируют 1 / 2 / 3 брони по степени, пока цель в бою. Одна метка за раз`;
    case 'trap':return `Соседняя пустая клетка. Враг, вошедший в неё: ${a.tdmg} урона без брони, стак кровотечения и не может двигаться, пока не вырвется (1 ОД, Сила против ${a.dc}). Крупного (2×2) не держит. Запас на бой — в карточке`;
    case 'dash':return `До скорости клеток к врагу и сразу удар: ${A[a.with]?A[a.with].name:''}. Всё за 1 ОД. Перезарядка ${a.cd}`;
    case 'veil':return `Клетка в пределах ${a.range} по линии видимости: d20 + Интуиция против ${a.dc}. Облако радиуса 1 (крит — 2) до конца следующего раунда: кто внутри, того видно и можно достать только с соседней клетки, и сам он действует только на соседей. Ночное зрение не помогает. Перезарядка ${a.cd}`;
    case 'stepback':return 'После атаки в этот ход: шаг на 1 клетку без ОД, один раз за ход';
    case 'bowFire':return `Клетка пола в пределах ${a.range} по линии видимости загорается и светит, как брошенный факел. Запас на бой — в карточке`;
    case 'evade':return `Освобождает из захвата, Вязки и капкана без броска, затем перемещение до скорости. До своего хода +${a.mag} к защите. Перезарядка ${a.cd}`;
    case 'rage':return `${a.turns>1?`До конца ${a.turns}-го своего хода`:'До конца следующего своего хода'}: +${a.atkB} к атакам, Сила +${a.strB}, защита −${a.defP}, штрафы ран не действуют; при 0 HP не падает, пока длится ярость. Перезарядка ${a.cd}`;
    case 'taunt':return 'Видимый враг: d20 + Харизма против базовой защиты + Интуиции цели. В свой следующий ход он атакует Шута, если может, иначе идёт к нему';
    case 'ditty':return `Голос: d20 + Харизма против ${a.dc}. Союзникам в радиусе ${a.radius} (и себе) +Харизма / ${fmtN(a.K)} по степени к атакам до конца их следующего хода. Сквозь стены. Перезарядка ${a.cd}`;
    case 'trip':return `Без урона. При попадании цель сбита с ног: −${a.trip} к защите до конца своего следующего хода`;
    case 'order':return `Союзник в пределах ${a.range} кл. (голос, сквозь стены): d20 + Харизма против ${a.dc}. При успехе союзник сразу бьёт лучшим доступным ударом вне очереди, без ОД. Перезарядка ${a.cd}`;
    case 'swap':return 'Соседний союзник; ОД тратит только тот, кто меняется';
    case 'door':return 'Соседняя дверь; запертую не открыть, занятую не закрыть';
    case 'breakbind':return 'Встречная Сила, ничья в пользу Инквизитора; после — только движение';
    case 'unbind':return 'Бесплатно; перемещение тоже снимает Вязку';
  }
  let h=a.hint||'';
  if(PAIN()&&(ATTACK_KINDS.includes(a.kind)||a.kind==='pair')&&a.fixed==null){const c=a.pcls||(wtOf(a)>=4?'heavy':'med'),ty=wType(a);h=`Боль ${PCLS[c].slice(1).join(' / ')} (${PCLS_RU[c]} ${PTYP_RU[ty]}${c==='heavy'?', нужна Сила 6':''})`+(h&&!/^Урон/.test(h)?'; '+h:'');}
  if(a.sneak)h+=(h?'; ':'')+`исподтишка (цель рядом с другим союзником, или вы в темноте, или в Завесе): +${a.sneak} к атаке и степень выше`;
  if(a.numb)h+=(h?'; ':'')+'при попадании цель онемеет: следующий ход с 1 ОД';
  if(a.ammo)h+=(h?'; ':'')+`запас ${a.ammo} на бой`;
  if(a.cd&&!['bind','wrath'].includes(id))h+=(h?'; ':'')+`перезарядка ${a.cd}`;
  const once=a.once&&!(id==='blades'&&SET.owlTwice);
  if((a.rolls||1)>1)h=`${a.rolls} броска за 1 ОД${once?', один раз за ход':', можно дважды за ход (опция)'}`+(h?'; '+h:'');
  else if(once)h='один раз за ход'+(h?'; '+h:'');
  return h;
}

function addWound(u,ar,opt={}){

/* Начало своего хода: открытая рана даёт +1 стак; обычная закрывается в начале 3-го хода, серьёзная — 4-го (сначала закрытие). */
function tickWounds(u){
  const closed=[];let add=0;

const SIM_CAP=40;
async function phaseLoop(){

    if(isHuman(S.phase)){S.busy=false;const cur=selUnit();if(!cur||cur.side!==S.phase||cur.down){const f=alive(S.phase).find(u=>u.od>0)||alive(S.phase)[0];S.sel=f?f.id:S.sel;}render();return;}

}

/* Филин по приоритетам (опция): ослеплён — бьёт ослепившего, пока не спадёт; иначе гасит все факелы на стенах уровня, потом на полу, потом бьёт носителя факела, потом случайного героя. */

function primaryAttack(u){return u.acts.find(id=>A[id]&&A[id].kind==='attack'&&!A[id].extra&&A[id].fixed==null)||null;}
const weakest=l=>l.slice().sort((a,b)=>a.hp-b.hp)[0];

/* План пути с препятствиями: двери открываются (1 ОД), Страж ломает стены и решётки (1 ОД за клетку). */
function planPath(u,goal){

    {const p=tokPos(u),ts=sz(u)>1?CELL*1.8:CELL;d.style.transform=`translate(${(p.x-ts/2).toFixed(1)}px,${(p.y-ts/2).toFixed(1)}px)`;}d.style.zIndex=u.down?1:2;
    d.querySelector('.disc span').textContent=u.glyph;
    const p=Math.max(0,u.hp)/u.maxHp,bar=d.querySelector('.hp i');bar.style.width=p*100+'%';bar.style.background=p>.5?'var(--good)':p>.25?'var(--warn)':'var(--bad)';
    d.querySelector('.od').innerHTML=u.down?'':[0,1].map(i=>`<b class="${i<u.od?'':'off'}"></b>`).join('')+(adLeft(u)>0&&!u.down?'<b class="ad" title="активная защита доступна"></b>':'');
    d.querySelector('.bd').innerHTML=u.down?'':badges(u).map(x=>`<span>${x[0]}</span>`).join('');
  }
  for(const d of [...box.children])if(!seen.has(d.dataset.id))d.remove();
}
function renderHL(){
  if(!S||S.sim)return;
  const cells=$('#hl').children,cls=new Array(S.w*S.h).fill('');
  const add=(x,y,c)=>{if(inB(x,y))cls[y*S.w+x]+=' '+c;};
  const addU=(o,c)=>{for(const p of cellsOf(o))add(p.x,p.y,c);};
  const u=selUnit();
  if(S.editor){for(let i=0;i<cls.length;i++)cls[i]=' ed';}
  else if(u&&S.act&&canControl(u)){
    const a=A[S.act];
    if(a.kind==='move'){
      const sp=speedOf(u),dist=bfs(u,{max:sp*Math.min(2,u.od)});
      for(const [k,v] of dist){if(!v.d)continue;const [x,y]=unkey(k);add(x,y,v.d<=sp?'mv1':'mv2');}
      if(S.hover){const hk=key(S.hover.x,S.hover.y);if(dist.has(hk)&&dist.get(hk).d>0){for(const [x,y] of pathTo(dist,S.hover.x,S.hover.y))add(x,y,'path');addU(posOf(u,S.hover.x,S.hover.y),'path');}}
    }else if(a.kind==='arc'){
      for(const c of ringCells(u))add(c.x,c.y,'arcpick');
      if(S.hover&&cheb(u,S.hover)===1&&!inFoot(u,S.hover.x,S.hover.y))for(const c of arcCells(u,S.hover.x,S.hover.y))if(adjOk(u,c))add(c.x,c.y,'arc');
    }else if(a.kind==='pair'){const ops=pairOptions(u);for(const p of ops)for(const t of p)addU(t,'tgt');if(S.hover){const ht=unitAt(S.hover.x,S.hover.y);const p=ht&&ops.find(p=>p.includes(ht));if(p)for(const t of p)addU(t,'arc');}}
    else if(a.kind==='torch'){for(const t of S.torches)if(validTorch(u,a,t))add(t.x,t.y,'tgt');}
    else if(a.kind==='throw'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validThrow(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validThrow(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='flare'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validFlare(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validFlare(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='jump'){for(const c of jumpCells(u,a))add(c.x,c.y,'rng');if(S.hover&&validJump(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='veil'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validVeil(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validVeil(u,a,S.hover))for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)add(S.hover.x+dx,S.hover.y+dy,'arc');}
    else if(a.kind==='trap'){for(const c of trapCells(u))add(c.x,c.y,'tgt');}
    else if(a.kind==='flash'){for(const c of fireSources())if(validFlash(u,c)){add(c.x,c.y,'tgt');}if(S.hover&&validFlash(u,S.hover))for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=hd(S.hover.x,S.hover.y,x,y);if(d<=3&&isFloor(x,y)&&fireLine(S.hover,{x,y}))add(x,y,d<=1?'arc':'rng');}}
    else if(a.kind==='step'){for(const c of stepCells(u))add(c.x,c.y,'mv1');}
    else if(a.kind==='evade'){for(const [k,v] of bfs(u,{max:speedOf(u)})){const [x,y]=unkey(k);add(x,y,v.d?'mv1':'path');}}
    else if(a.kind==='door'||a.kind==='smash'){for(const c of ringCells(u))if(validCell(u,a,c.x,c.y))add(c.x,c.y,'tgt');}
    else{
      if(a.ranged){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=cheb(u,{x,y});if(d>=(a.noAdj?2:1)&&d<=a.range&&isFloor(x,y)&&los(u,{x,y},u).ok)add(x,y,'rng');}}
      else if((a.reach||1)>1&&a.kind==='attack'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=cheb(u,{x,y});if(d>=1&&d<=a.reach&&isFloor(x,y)&&(d===1?adjOk(u,{x,y}):reachClear(u,{x,y},u)))add(x,y,'rng');}}
      else if(a.kind==='buff'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=cheb(u,{x,y});if(d>=1&&d<=(a.range||3)&&isFloor(x,y))add(x,y,'rng');}}
      for(const t of S.units)if(canTarget(u,a,t))addU(t,['cover','buff','swap','bandage','heal','order','ordnow','ordback','revive'].includes(a.kind)?'ally':'tgt');
    }
  }
  for(let i=0;i<cells.length;i++){const c='c'+cls[i];if(cells[i].getAttribute('class')!==c)cells[i].setAttribute('class',c);}
}

/* ================= ПАНЕЛИ ================= */
function canControl(u){return !!u&&!u.down&&!S.over&&!S.busy&&!S.editor&&u.side===S.phase&&isHuman(u.side);}
function actState(u,id){
  const a=A[id];
  if(id==='escape'&&!u.grabbedBy&&!hasEff(u,'snare')&&!hasEff(u,'lasso'))return{show:false};
  if(id==='unlasso'&&!(V2()&&lassoTarget(u)))return{show:false};
  if(id==='standup'&&(!u.prone||onEdge(u)))return{show:false};
  if(id==='revive'&&!(PAIN()&&u.side==='pc'))return{show:false};
  if(!V2()&&['push','prep','prepPush','standup'].includes(id))return{show:false};
  if(id==='throwHeld'&&!u.torch)return{show:false};
  if(id==='breakbind'&&!hasEff(u,'bound'))return{show:false};
  if(id==='unbind'&&!u.binding)return{show:false};
  if(id==='door'&&!Object.keys(S.doors).length)return{show:false};
  if(id==='swap'&&(sz(u)>1||!friends(u).length))return{show:false};
  if(id==='knifeExtra'&&!(u.hp<A.knifeExtra.hpBelow))return{show:false};
  if(id==='relight')return{show:false};
  if(id==='douse'&&!S.torches.length)return{show:false};
  let why=null;
  const bound=hasEff(u,'bound'),cdR=a.cd?((u.cd||{})[id]||0):0;
  if(S.over)why='бой окончен';
  else if(u.side!==S.phase)why='сейчас ход другой стороны';
  else if(!isHuman(u.side))why='управляет ИИ';
  else if(S.busy)why='подождите';
  else if(onEdge(u)&&!edgeOk(id,a))why='на пороге: только ползти, перевязывать, приказывать';
  else if(a.cost>u.od)why=`нужно ${a.cost} ОД`;
  else if(cdR>S.round)why=`перезарядка: снова в раунде ${cdR}`;
  else if(u.moveOnly&&a.kind!=='move')why='вырвался из Вязки: до конца хода только движение';
  else if(!reqOk(u,id))why=`нужна ${Object.entries(a.req).map(([s,v])=>STAT_RU[s]+' '+v).join(', ')}`;
  else if(a.kind==='move'&&bound)why='под Вязкой';
  else if(a.kind==='move'&&u.grabbedBy)why='в захвате';
  else if(a.kind==='move'&&u.hold)why='удерживает цель';
  else if(ATTACK_KINDS.includes(a.kind)&&u.binding)why='держит Вязку: атаки недоступны';
  else if(ATTACK_KINDS.includes(a.kind)&&bound&&!a.offhand&&!a.ranged&&!((a.rolls||1)>1))why='оружие связано';
  else if(a.kind==='smash'&&bound)why='оружие связано';
  else if(a.kind==='grab'&&u.hold)why='уже удерживает цель';
  else if(a.kind==='bind'&&u.binding)why='уже держит Вязку';
  else if(u.grabbedBy&&a.atk==='dex')why='в захвате: способности на Ловкости недоступны';
  else if(a.needLoad&&!u.loaded)why='арбалет разряжен';
  else if(id==='reload'&&u.loaded)why='уже заряжен';
  else if(id==='knifeExtra'&&u.extraUsed)why='уже использован в этом ходу';
  else if(a.once&&u._once&&u._once[id]&&!(id==='blades'&&SET.owlTwice))why='только один раз за ход';
  else if(id==='shriek'&&shriekTargets(u).length<a.minT)why=`рядом ${shriekTargets(u).length} из ${a.minT} нужных героев`;
  else if(a.kind==='throw'&&!(u.torches>0))why='факелов в запасе нет';
  else if(a.ammo&&!((u.ammo||{})[id]>0))why='запас кончился';
  else if(a.kind==='trap'&&!(u.traps>0))why='капканов не осталось';
  else if(a.kind==='step'&&!u._atk)why='сначала атакуйте в этот ход';
  else if(['move','dash','step'].includes(a.kind)&&hasEff(u,'snare'))why='в капкане';
  else if(a.kind==='bandage'&&!(u.bandages>0))why='бинтов не осталось';
  else if(a.kind==='bandage'&&!hasTargets(u,id))why='нет кровотечения и открытых ран рядом';
  else if(a.kind==='revive'&&!hasTargets(u,id))why='рядом нет союзника без сознания (и клетка под ним должна быть свободна)';
  else if(V2()&&a.speech&&hasEff(u,'mute'))why='Немота: нужна речь';
  else if(V2()&&a.kind==='move'&&hasEff(u,'lasso'))why='в силке';
  else if(V2()&&a.kind==='prep'&&u.prep)why='уже готовится';
  else if(V2()&&a.lasso&&lassoTarget(u))why='силок занят';
  else if(V2()&&ATTACK_KINDS.includes(a.kind)&&!a.magic&&!a.offhand&&!a.lasso&&(partSt(u,'armR')>=3||lassoPart(u)==='armR'))why='рука с оружием не действует';
  else if(disLock(u,id))why=disLock(u,id);
  else if(!hasTargets(u,id))why='нет доступной цели';
  return{show:true,ok:!why,why};
}
function actsOf(u){const out=[];for(const id of u.acts){out.push(id);if(id==='move')out.push('swap','door');}if(!out.includes('swap'))out.push('swap','door');out.push('breakbind','unbind','unlasso');if(PAIN()&&u.side==='pc')out.push('revive');return out;}
function visibleActs(u){return actsOf(u).filter(id=>A[id]&&actState(u,id).show);}

function renderCard(){
  const u=selUnit(),box=$('#card');
  if(!u){box.innerHTML='<h2 class="ph">Боец</h2><p class="help">Нажмите на фигуру на поле, чтобы увидеть характеристики.</p>';return;}
  const p=Math.max(0,u.hp)/u.maxHp,best=bestDefStat(u),f=disForm(u);

function editorClick(x,y){
  const k=key(x,y),u=unitAt(x,y)||S.units.find(o=>inFoot(o,x,y));
  const clearCell=()=>{S.walls.delete(k);delete S.doors[k];delete S.bars[k];S.torches=S.torches.filter(t=>!(t.x===x&&t.y===y));};
  switch(S.etool){
    case 'unit':{
      if(u){S.sel=u.id;break;}
      const n=mkUnit(S.etpl,S.eside,x,y);
      if(footFree(n,x,y)){nameUnit(n,S.units);S.units.push(n);S.sel=n.id;}else{UID--;}
      break;}
    case 'erase':if(u){S.units=S.units.filter(o=>o!==u);if(S.sel===u.id)S.sel=null;}break;
    case 'moveu':if(S.emove!=null){const m=byId(S.emove);if(m&&footFree(m,x,y)){m.x=x;m.y=y;}S.emove=null;}else if(u){S.emove=u.id;S.sel=u.id;}break;
    case 'wall':if(!u){clearCell();S.walls.add(k);}break;
    case 'floor':clearCell();break;
    case 'torch':{const t=torchAt(x,y);if(t)S.torches=S.torches.filter(o=>o!==t);else if(!u){delete S.doors[k];delete S.bars[k];S.walls.add(k);S.torches.push({x,y,lit:true});}break;}
    case 'door':{const d=S.doors[k];if(d){if(d.open&&u)break;d.open=!d.open;if(d.open)d.locked=false;}else if(!u){clearCell();S.doors[k]={open:false,locked:false};}break;}
    case 'lock':{const d=S.doors[k];if(d){d.locked=!d.locked;if(d.locked)d.open=false;}else if(!u){clearCell();S.doors[k]={open:false,locked:true};}break;}
    case 'bars':if(!u){if(S.bars[k])delete S.bars[k];else{clearCell();S.bars[k]={shoot:false};}}break;
    case 'barsShoot':if(S.bars[k])S.bars[k].shoot=!S.bars[k].shoot;else if(!u){clearCell();S.bars[k]={shoot:true};}break;
  }
  S.lv=(S.lv||0)+1;drawFloor();drawLight(performance.now());render();
}

function cellFromEvent(e){const c=e.target.closest&&e.target.closest('.c');if(!c)return null;return{x:+c.getAttribute('data-x'),y:+c.getAttribute('data-y')};}
function onCellClick(e){
  if(SIMULATING)return;

  if(S.busy)return;
  const u=selUnit(),t=unitAt(p.x,p.y)||koAt(p.x,p.y);
  if(S.act&&canControl(u)){
    const a=A[S.act],id=S.act;
    if(a.kind==='move'){const dist=bfs(u,{max:speedOf(u)*Math.min(2,u.od)});const v=dist.get(key(p.x,p.y));if(v&&v.d>0){run(()=>performMove(u,p.x,p.y));return;}}
    else if(a.kind==='arc'){if(cheb(u,p)===1&&!inFoot(u,p.x,p.y)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='pair'){if(t&&pairOptions(u).some(q=>q.includes(t))){run(()=>perform(u,id,t));return;}}
    else if(a.kind==='wswap'){run(()=>perform(u,id));return;}
    else if(a.kind==='torch'){const tc=torchAt(p.x,p.y);if(tc&&validTorch(u,a,tc)){run(()=>perform(u,id,tc));return;}}
    else if(a.kind==='throw'){if(validThrow(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='flare'){if(validFlare(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='jump'){if(validJump(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='veil'){if(validVeil(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='trap'){if(validTrap(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='flash'){if(validFlash(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='step'){if(stepCells(u).some(c=>c.x===p.x&&c.y===p.y)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='evade'){if(evadeOk(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='door'||a.kind==='smash'){if(validCell(u,a,p.x,p.y)){run(()=>perform(u,id,p));return;}}
    else if(t&&canTarget(u,a,t)){run(()=>perform(u,id,t));return;}
  }
  const any=t||S.units.find(o=>inFoot(o,p.x,p.y));
  if(any){S.sel=any.id;S.act=null;render();return;}
  if(S.act){S.act=null;render();}
}

        else{html+=`<div class="m">обычный ${pct(h.p[1])} · усиленный ${pct(h.p[2])} · крит ${pct(h.p[3])}</div><div class="m">${PAIN()?'Боль':'урон'} по степеням ${h.dm[1]} / ${h.dm[2]} / ${h.dm[3]}${a.knock?' (×2 о препятствие)':''}</div><div>Ожидаемо <b>${fmtN(h.Eact)}</b> за действие${h.reps>1?` (${h.reps} броска)`:''}</div>`;}
        if(canActiveDefend(t))html+=`<div class="dim">У цели есть активная защита: повторный бросок d20 ${sgn(sum(activeMods(t,a)))}</div>`;
        if(cov){const kn=byId(cov.by);if(kn&&!kn.down)html+=`<div class="dim">Атаку перехватит ${esc(kn.name)} (Прикрытие)</div>`;}
      }else if(a.kind==='bind'){
        const pa=sum([{v:stat(u,'str')},...rollMods(u),{v:-darkPen(u)}]),pb=sum([{v:stat(t,'str')},...rollMods(t,true),{v:-darkPen(t)}]);
        html=`<b>Вязка</b> → ${esc(t.name)}<div class="big">${pct(pContest(pa,pb,false))}</div><div class="m">Сила ${pa} против ${pb}, ничья в пользу цели</div><div class="m">вырваться за попытку: ${pct(1-pContest(pa,pb,true))}</div>`;
      }else if(a.kind==='buff'){
        const m=stat(u,'cha')+sum(rollMods(u)),c=[0,0,0,0];for(let r=1;r<=20;r++){const d=r+m-a.dc;c[d>=10?3:d>=5?2:d>=0?1:0]++;}
        const bon=t2=>Math.floor(stat(u,'cha')*MULT[t2]/a.K+1e-9);
        html=`<b>${esc(a.name)}</b> → ${esc(t.name)}<div class="m">успех ${pct((c[1]+c[2]+c[3])/20)}: +${bon(1)} (${pct(c[1]/20)}), +${bon(2)} (${pct(c[2]/20)}), +${bon(3)} (${pct(c[3]/20)})</div><div class="dim">${hintOf(S.act,a)}</div>`;
      }else if(a.kind==='swap'){html=`Поменяться местами с ${esc(t.name)} · 1 ОД`;}
      else if(a.kind==='debuff'&&(a.eff==='mark'||a.eff==='taunt')){const o=curseOdds(u,t,a);html=`<b>${esc(a.name)}</b> → ${esc(t.name)}<div class="big">${pct(1-o.p[0])}</div><div class="m">d20 + ${STAT_RU[a.stat||'int']} ${stat(u,a.stat||'int')} против ${o.dc}${a.vs==='def'?' (база + Интуиция цели), ничья — провал':''}</div><div class="dim">${hintOf(S.act,a)}</div>`;}
      else if(a.kind==='debuff'){const o=curseOdds(u,t,a),m=k=>Math.floor(stat(u,'int')*MULT[k]/a.K+1e-9);html=`<b>${esc(a.name)}</b> → ${esc(t.name)}<div class="big">${pct(1-o.p[0])}</div><div class="m">d20 + Интуиция ${stat(u,'int')} против ${o.dc}${a.eff==='vuln'?' (база + Интуиция цели), ничья — провал':''}</div><div class="m">−${m(1)} (${pct(o.p[1])}), −${m(2)} (${pct(o.p[2])}), −${m(3)} (${pct(o.p[3])}) · ${a.turns||2} хода цели</div>`;}
      else if(a.kind==='heal'){const m=stat(u,'int')+sum(rollMods(u));let ok=0;for(let r=1;r<=20;r++)if(r+m-(a.dc||12)>=0)ok++;const pts=k=>Math.floor(stat(u,'int')*MULT[k]/(a.K||2.5)+1e-9);html=`<b>${esc(a.name)}</b> → ${t===u?'себя':esc(t.name)}<div class="big">${pct(ok/20)}</div><div class="m">пунктов ${pts(1)} / ${pts(2)} / ${pts(3)} · стаков ${t.bleed}, открытых ран ${openWounds(t).length}</div>`;}
      else if(a.kind==='order'){const st=orderStrike(t),m=stat(u,'cha')+sum(rollMods(u));let ok=0;for(let r=1;r<=20;r++)if(r+m-(a.dc||14)>=0)ok++;html=`<b>Боевой приказ</b> → ${esc(t.name)}<div class="big">${pct(ok/20)}</div>${st?`<div class="m">ударит: ${esc(A[st.id].name)} → ${esc(st.t.name)}, ожидаемо ${fmtN(st.E)}</div>`:''}`;}
      else if(a.kind==='dash'){const c=dashCell(u,t),w=A[a.with],h=hitCalc(u,w,t);html=`<b>Рывок</b> → ${esc(t.name)} · ${c?c.d+' кл.':''}<div class="big">${pct(h.hit)}</div><div class="m">${esc(w.name)}: урон ${h.dm[1]} / ${h.dm[2]} / ${h.dm[3]}</div>`;}
      else if(a.kind==='bandage'){const pts=a.pts||3,rm=Math.min(pts,t.bleed),cl=Math.min(pts-rm,openWounds(t).length);html=`<b>Перевязка</b> → ${t===u?'себя':esc(t.name)} · 1 бинт<div class="m">стаков кровотечения ${t.bleed}, открытых ран ${openWounds(t).length}</div><div class="m">снимет стаков ${rm}${cl?`, закроет ран ${cl}`:''}</div>`;}
      else if(a.kind==='cover'){html=`<b>Прикрытие</b> → ${esc(t.name)}`;if(t.disorder==='distrust'&&disForm(t)){const need=baseDef(t)-stat(u,'cha');html+=`<div class="m">${DIS.distrust[disForm(t)-1]}: нужна проверка Харизмы, шанс ${pct(Math.min(20,Math.max(0,21-need))/20)}</div>`;}}
    }
    tip.innerHTML=html;
  }
  tip.hidden=false;
  const r=tip.getBoundingClientRect();let x=e.clientX+16,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-12;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

let modalOnClose=null;
function openModal(html,mount,opt={}){modalOnClose=opt.onClose||null;$('#mbox').classList.toggle('wide',!!opt.wide);$('#mbox').innerHTML=`<button type="button" class="x" id="mClose">Закрыть</button>`+html;$('#modal').hidden=false;$('#mClose').onclick=closeModal;$('#mClose').focus();if(mount)mount();}

    <div class="opt"><span class="lbl">2.0: защита противников</span>${radio('enemyFullDef',[['false','рядовые только уклоняются; блок, парирование и контратака — у особых'],['true','все противники защищаются как герои']])}</div>

    <div class="opt"><span class="lbl">Зона контроля</span>${radio('zoc',[['true','выход из соседства с врагом — его внеочередная атака (одна за раунд)'],['false','выкл.']])}</div>

    <div class="opt"><span class="lbl">Внеочередная атака при Паранойе</span>${radio('paranoiaOD',[['false','бесплатна'],['true','тратит 1 ОД']])}</div>

function openNotes(){
  openModal(`<h2>Допущения тестового поля</h2><p class="dim">Что поле считает утверждённым, а что взято как рабочее решение. Неутверждённое, где возможно, переключается в «Настройках правил» или правится в «Персонажах и оружии».</p>
  <h3>Боевая система 2.0 (включена по умолчанию)</h3><ul>
  <li><b>Боль вместо HP</b> (по умолчанию, переключается в «Правилах»). Предел 5: герой +1, Крепкий +1, Хрупкий −1, рядовой противник −1. Боль удара по степени: лёгкое 1/1/2, среднее 1/2/3, тяжёлое 1/2/4 (нужна Сила 6). Броня гасит половину текущей прочности (вверх); колющее усиленным и критическим — на 1 меньше; прочность стирают крит, дробящее усиленным и Сила 7+ вблизи. Каждые 2 Боли — −1 к атакам и способностям. Герой на пределе — «на пороге» (лежит, 1 ОД: ползти, перевязка, приказы), следующая Боль — без сознания; кровотечение без сознания — шаги к смерти, третий — смерть. «Привести в чувство» — 2 ОД. Проклятия — против Самообладания (8 + Интуиция).</li>
  <li><b>3 ОД</b> (переключается в «Правилах»). ОД, не потраченные в свой ход, — запас реакций до начала своего следующего хода; на старте своего хода он сгорает. Из запаса платятся защита (вид выбирается в момент удара), удар из зоны контроля, срабатывание подготовки, толчок щитом Конрада. Контратака после блока или парирования и согласованная контратака бесплатны. Первый ход боя: у начинающей стороны 2 ОД, у второй — полный запас, его можно сразу тратить на защиту.</li>
  <li><b>Пассивной защиты нет.</b> Атака попадает всегда; бросок d20 + мастерство против Стойкости (8 + Телосложение) решает только степень: до +4 — обычный, +5 — усиленный, +10 — критический. Критический успех, пробивший броню, наносит рану. Щит добавляет свои очки к броску блока. Дальний бой оружием: дальше 6 гексов −5 к броску.</li>
  <li><b>Прикрыть союзника</b> — реакция всех: соседнего союзника атакуют (не по площади и не реакцией), а атакующий достаёт и вас — можно за 1 очко реакции принять удар на себя; защита от него оплачивается отдельно. Конрад (Перехват) прикрывает бесплатно, если у него есть хотя бы 1 очко на защиту. Из болванчиков прикрывает только Щитоносец.</li>
  <li>Ловкачи (Ловкость 7+): по умолчанию одно бесплатное уклонение за раунд; в «Правилах» можно переключить на +1 ОД в ход или убрать.</li>
  <li>Болванчики: держат 1 ОД на защиту; рядовые бьют того, кто рядом (открытых охотнее), ввязавшись, не уходят, при трети HP отступают; стрелки держат 3–6 гексов, стреляют в открытых и отходят, если вплотную их не накажут.</li>
  <li>Мастерство: два значения у каждого бойца — ближний и дальний бой. Мастерство заменяет Ловкость в попадании оружием и в парировании. Ловкость остаётся за пассивную защиту, уклонение и скорость; блок — от Силы. У магии своё мастерство (попадание заклинаний и проклятий), урон магии — от Интуиции.</li>
  <li>Активная защита — уклонение (Ловкость), блок щитом (Сила) или парирование (Ловкость) против уже выпавшего броска атаки; из блока и парирования вычитается вес оружия атакующего (0 / 2 / 4). Перевес 5+ в блоке или парировании — контратака с +5, 10+ — с +10. Неудачная защита ничего не ухудшает. Рядовые противники только уклоняются.</li>
  <li>Минимального урона 1 нет. Скользящий удар: если броня погасила всё, усиленный или критический успех всё равно наносит 1.</li>
  <li>Раны: обычная даёт только кровотечение; серьёзная — 1 стак (−2), тяжёлая — 2 стака (−4), ампутация — конечность не действует. Рука — к атакам и защите этой рукой, нога — к скорости и уклонению, голова — к Харизме.</li>
  <li>Состояния со стаками: Рябь (на 3-м — Слепота), Кашель (Немота), Дезориентация (потеря сознания), Неустойчивость (на 2-м — сбит с ног), Нагрев (каждые 3 — 6 урона сквозь броню). В конце своего хода спадает по стаку, Нагрев сам не спадает.</li>
  <li>Толчок, «Встать», подготовка удара или толчка — у всех героев. Удар в спину: союзник строго напротив или цель беспомощна — +3 урона.</li>
  <li>Первый ход боя в режиме 2 ОД: у начинающей стороны 1 ОД.</li>
  <li><b>Воля и расстройства</b> включены: Конрад — Недоверие/Паранойя, Хельга — Стыд/Самоненависть, Вальтер — Жестокость/Садизм. Воля в бою почти не меняется (жестокое добивание, ведущий на карточке); расстройство включается при Воле −10, сильная форма — при −20. Стыд: заклинания с освещённого гекса −3 (Самоненависть −5, натуральная 1 — магическая отдача 3 урона сквозь броню). Жестокость: −3 по цели без раны (Садизм — −6, бить только раненых, жестокое добивание).</li>
  <li><b>Пороги промаха</b> по натуральному d20: дальность больше 6 гексов — 5, Рябь ×1 — 5, ×2 — 7, атакующий в темноте — 5; источники складываются, потолок 15. Не выше порога — промах без броска защиты. Защита из темноты тоже срывается на натуральных 1–5.</li>
  <li>Заклинания без цели (Вспышка, Магическое зрение): d20 + мастерство магии против сложности (по умолчанию 12, в «Правилах»); степень задаёт радиус или длительность. Проклятия ложатся всегда, как атаки; степень задаёт силу Слабости.</li>
  <li><span class="pend"></span>Упрощения поля: у подготовки одно условие («враг вошёл в досягаемость или атакует из неё»); предсказание действий Вальтера только пишется в журнал; слабых мест два, только конечности; онемение, яд, обезоруживание и Оглушение не включены — их пока никто не накладывает.</li></ul>
  <h3>Утверждено</h3><ul>
  <li>Попадание d20 + Ловкость, пассивная защита = базовая + Ловкость + щит, урон от Силы. Ничья в атаке — в пользу защиты; обычный успех в атаке от +1.</li>
  <li>Дроби отбрасываются везде: урон, радиусы, бонусы, эффекты магии.</li>
  <li>Скорость: 3, после Ловкости 5 +1 за каждые 2 Ловкости.</li>
  <li>Активная защита: бесплатно, по желанию, один раз между своими ходами (восстанавливается в начале своего хода). Применяется после того, как атака пробила пассивную. Бросок d20 + Ловкость + щит заменяет пассивную защиту, степень считается от него — может стать и хуже. Только против бросков атаки на защиту.</li>
  <li>Прикрытие перехватывает атаку, только если атакующий с той же позиции мог бы атаковать и Рыцаря этим же ударом (дотягивается, видит, линия не перекрыта). Иначе атака идёт в прикрытого.</li>
  <li>Вязка: перезарядка начинается только после успеха.</li>
  <li>Горящий факел можно бросить из рук (1 ОД, до 4 клеток) — тогда персонаж больше не носитель факела.</li>
  <li>Контрудар Ветерана срабатывает при успешной активной защите: атакующий получает рану руки с оружием (по общим правилам ран: обычная, по открытой — степень выше) и 2 урона сквозь броню. Перелома нет.</li>
  <li>Птичий крик и Воодушевление действуют по радиусу сквозь стены.</li>
  <li>Перезарядка: применение в раунде N с перезарядкой K — снова доступно в раунде N + K.</li>
  <li>Страж: топор 1 ОД, Размашистый удар 2 ОД; может атаковать, пока держит; критическое попадание заставляет отпустить. Занимает 3 гекса треугольником (вершиной вниз), не проходит в проход шириной 1, невосприимчив к перемещению, за 1 ОД гарантированно разрушает клетку стены, двери или решётки. Разрушенная клетка пропускает свет и линию атаки. Размашистый удар: 3 соседних гекса вокруг него подряд (одна сторона треугольника или угол), из 9. Области задевают Стража, если в них попала хоть одна его клетка.</li>
  <li>Филин: 2 броска за 1 ОД, один раз за ход. В «Настройках правил» есть опция «дважды за ход» для проверки.</li>
  <li>Смена оружия — 1 ОД (отдельным действием или вместе с ударом другим оружием). У Охотника на нечисть первая за ход смена оружия или перезарядка арбалета бесплатна. Что в руках — видно в карточке.</li>
  <li>Удар щитом: фиксированный 1, броня не снижает; персонаж на пути отбрасывания — препятствие.</li>
  <li>Инквизитор: Ловкость 6, броня 3. Цепная булава игнорирует щит цели.</li>
  <li>Вязка: соседняя цель, встречная Сила, ничья в пользу цели. Цель не двигается и не бьёт связанным оружием до следующего хода Инквизитора; другой рукой может (Захват конечности, удар щитом), Размашистый удар — нет; Филин бьёт одним свободным клинком. Защита связанного −2. Урон от идущего захвата продолжается. Вырваться: 1 ОД, встречная Сила, ничья в пользу Инквизитора; после этого до конца хода только движение. Инквизитор не атакует, может снять Вязку бесплатно, его перемещение снимает Вязку.</li>
  <li>Слепящий свет на самого Инквизитора не действует.</li>
  <li>Рапира: броня цели −1, но не ниже 1; так же у Укола.</li>
  <li>Воодушевление: одна цель за раз, не на себя, в пределах 3 клеток; до конца второго собственного хода цели после применения; на время действия подавляет расстройства.</li>
  <li>Поле — гексагоны вершиной вверх, нечётные ряды сдвинуты на полгекса. У каждого гекса 6 соседей; все расстояния, радиусы, досягаемость и свет считаются шагами по гексам. Стена занимает целый гекс.</li>
  <li>Сквозь союзников и противников проходить нельзя. Обмен местами с соседним союзником — 1 ОД.</li>
  <li>Дверь: открыть или закрыть — 1 ОД, нужно стоять рядом; занятую дверь не закрыть; запертые двери бывают; Страж их ломает. Решётки пропускают свет, но не проход; бить сквозь решётку — свойство конкретной решётки.</li>
  <li>Оружие с досягаемостью 2 не бьёт через персонажа, только если он стоит в единственном гексе посередине; если средних гексов два, удар проходит, когда свободен хотя бы один. Линия видимости — так же: если линия идёт по ребру между гексами, видно, когда свободен хотя бы один из двух.</li>
  <li>Свет: факел освещает все гексы в 3 шагах. Глухие стены и закрытые двери его не пропускают; открытые проёмы, решётки и персонажи пропускают. Зоны нескольких источников объединяются. Полутьмы нет: гекс либо на свету, либо в темноте. Погасший факел заново не зажечь.</li>
  <li>Филин видит в темноте: темнота ему не мешает ни атаковать, ни защищаться, ни выбирать цели.</li>
  <li>Факелы: у каждого героя по 2, у противников, кроме Филина и Стража, тоже по 2. Факел можно бросить на пол.</li>
  <li>Рана: фактический урон 8+ за один удар (после брони). Удар на 5–7 даёт один стак кровотечения без раны; за один удар — не больше одного стака (клинки Филина тоже дают один). Степени: обычная → серьёзная → тяжёлая → ампутация. Новая рана по открытой области повышает степень и заново запускает срок, по закрытой — та же степень. Обычная закрывается в начале 3-го хода после получения, серьёзная — 4-го; тяжёлая и ампутация сами не закрываются. Четвёртая рана головы или тела, пока область открыта, — смерть.</li>
  <li>Кровотечение: рана сразу даёт 1 стак, каждая открытая рана — ещё 1 в начале каждого своего хода. В конце раунда каждый стак наносит 1 урона, затем снимается 1 стак.</li>
  <li>Штрафы ран: обычная — без штрафа, серьёзная −2, тяжёлая −3, ампутация −5. Рука — к Силе, нога — к Ловкости, голова — к Интуиции и Харизме. Штраф остаётся и после закрытия раны.</li>
  <li>Перевязка: 1 ОД, один бинт = 3 лечебных пункта: сначала по 1 на каждый стак кровотечения, затем по 1 на открытую рану. Работает и на тяжёлой ране.</li>
  <li>Ведьма. Огненная стрела: попадание и урон от Интуиции. Уязвимость: d20 + Интуиция против базовой защиты + Интуиции цели; по степени −Интуиция / 2,5 к пассивной и активной защите на 2 хода цели, броня не меняется, повтор обновляет срок и не складывается. Затуманенный разум: d20 + Интуиция против 14; по степени −Интуиция / 2,5 к атакам и способностям цели на 2 хода цели.</li></ul>
  <h3>Баланс на пятерых героев</h3><ul>
  <li><span class="pend"></span>Посчитано автобоями (по 2000 на сценарий) для группы Рыцарь ×2, Инквизитор, Барон, Ведьма: мелкие ×5 — все живы ≈90%; Страж — ≈95%; Страж и мелкий у входа — ≈90%; ветераны и тюремщики ×5 — ≈50%; Филин вырезает всех ≈10%.</li>
  <li><span class="pend"></span>Базовая защита у всех 6 вместо 10. Оружие героев: меч, булава, Удар в голову и цепная булава K = 1,5; рапира K = 2; Укол K = 1,5; Огненная стрела K = 2,5.</li>
  <li><span class="pend"></span>Удар в голову: перезарядка 3 — без неё два Рыцаря держат одиночного босса в оглушении. У Стража и Филина по 2 активные защиты за раунд.</li>
  <li><span class="pend"></span>Расстановка сильно влияет на исход: в сценарии со Стражем и мелким противником тот же состав даёт от 75% до 94% в зависимости от того, где стоит мелкий.</li>
  <li><span class="pend"></span>Победы Филина длятся около 10 раундов: он бьёт клинками раз за ход и убивает героев по одному. Бои, где побеждают герои, укладываются в 8 раундов.</li></ul>
  <h3>Новые герои (требует утверждения)</h3><ul>
  <li><span class="pend"></span>Сила героя проверена заменой: каждый ставится вместо второго Рыцаря в группу Рыцарь, Инквизитор, Барон, Ведьма и проходит все пять сценариев. Новые герои дают результат в пределах разброса старых.</li>
  <li><span class="pend"></span>Исключения из «урон от Силы»: оружие на Ловкость (изогнутый клинок Странника, кинжалы Разбойницы и Шута) — попадание и урон от Ловкости; урон лука задаёт стрела, лук умножает его (сейчас короткий лук ×1).</li>
  <li><span class="pend"></span>Монах (Харизма, Интуиция). Обезболивание (бывшее Залечивание; в бою без ограничений, вне боя — раз на комнату, эффект только в этой комнате): пункты снимают стаки, закрывают раны и смягчают закрытые раны на ступень, HP не лечит. Псалом стойкости: + к защите союзникам рядом. Громовой глас: урон голосом по площади без брони. Голос действует сквозь стены.</li>
  <li><span class="pend"></span>Охотник на нечисть (Сила, Ловкость). Тесак: если удар даёт кровотечение или рану — ещё 1 стак кровотечения. Рогатина на 2 клетки: критический успех — рана. Арбалет с пробитием 2, 5 болтов одного вида. Первая за ход смена оружия или перезарядка бесплатна. Капкан ставится на свободную клетку в радиусе 2 (по линии видимости). Слабое место — как раньше.</li>
  <li><span class="pend"></span>Странник с Востока (Ловкость, Интуиция). Изогнутый клинок; Рывок — подбежать и ударить за 1 ОД; Удар в точку — онемение, следующий ход с 1 ОД; Отскок на клетку после атаки без ОД; Завеса — облако, сквозь которое видно и бьют только вплотную.</li>
  <li><span class="pend"></span>Разбойница (Ловкость). Лук: охотничьи стрелы без счёта, бронебойные (3, пробитие 3), зажигательные (2, поджигают клетку на дальности 8). Кинжал и Удар исподтишка (+3 и степень выше, если цель рядом с другим героем или Разбойница в темноте или в Завесе). Ускользнуть: освободиться из захвата и Вязки и отойти (без атак зоны контроля), +3 к защите; капкан не снимает — в капкане только +3 к защите.</li>
  <li><span class="pend"></span>Воитель Севера (Сила). Секира K 1,5, Размах секирой по дуге, броня 3, 28 HP. Ярость: +1 к атакам, Сила +1, защита −4, штрафы ран не действуют, при 0 HP не падает, пока длится ярость.</li>
  <li><span class="pend"></span>Шут (Харизма). Балаганная песенка: + к атакам союзникам рядом. Насмешка: враг атакует Шута на своём ходу. Подножка: без урона, цель −3 к защите. Шутовской кинжал на Ловкости.</li>
  <li><span class="pend"></span>Рыцарь — теперь Сила + Харизма (старый удалён): Ловкость 4, Харизма 7, броня 3, Боевой приказ. По умолчанию в руках меч; Размашистый удар мечом — 1 ОД, −3 к атаке, два противника рядом с Рыцарем и рядом друг с другом, отдельный бросок по каждому. Булава и Удар в голову — после смены оружия.</li>
  <h3>Воля и расстройства</h3><ul>
  <li>Начальная Воля героев — 15. Критический провал атаки или способности — −${WILL_CRIT} Воли, критический успех — +${WILL_CRIT} (выключается в «Настройках правил»). Слабая форма — Воля от −10 до −19, сильная — −20 и ниже, сильная заменяет слабую. Воодушевление подавляет расстройство на время действия. У Филина Воли нет.</li>
  ${Object.keys(DIS).map(k=>{const who=[...new Set(Object.values(T).filter(t=>t.disorder===k).map(t=>t.name))].join(', ');return `<li><b>${DIS[k][0]} → ${DIS[k][1]}</b>${who?` <span class="dim">(${esc(who)})</span>`:''}. Слабая: ${disDesc(k,1)}. Сильная: ${disDesc(k,2)}.</li>`;}).join('')}
  </ul>
  <h3>Требует утверждения</h3><ul>
  <li><span class="pend"></span>Область раны — d6: голова, тело, левая и правая рука, левая и правая нога. Удар в голову всегда по голове. Тело штрафа к характеристикам не даёт. После ампутации конечности новые раны туда не ложатся — удар 8+ даёт только стак кровотечения.</li>
  <li><span class="pend"></span>В начале 3-го (4-го) хода рана сначала закрывается, поэтому стака в этот ход уже нет.</li>
  <li><span class="pend"></span>0 HP — персонаж выбывает из боя; последствия 0 HP не утверждены.</li>
  <li><span class="pend"></span>Бинты: по 2 у каждого героя, у противников нет. 1 ОД за бинт, себе или соседу; лишние пункты бинта пропадают; сначала закрываются самые тяжёлые раны.</li>
  <li><span class="pend"></span>Носитель факела: первый герой и первый противник с факелами начинают бой с горящим факелом в руке (из своего запаса). Факел выбывшего падает на пол и горит.</li>
  <li><span class="pend"></span>Бросить факел: 1 ОД, до 4 клеток по линии видимости, на клетку пола без другого факела (можно себе под ноги). Факел на полу гасится так же, как на стене: с соседней клетки или стоя на нём.</li>
  <li><span class="pend"></span>Уязвимость — как атака: ничья — провал. Затуманенный разум не действует на защиту и на попытки вырваться из захвата и Вязки.</li>
  <li><span class="pend"></span>Филин: Ловкость 14, Интуиция 10, Сила 8, HP 26, 2 активные защиты, стойкость босса. Попадает почти всегда, урон с клинка меньше; вырезает всех ≈12%, «всухую» герои побеждают ≈22% боёв (было ≈53%), в среднем погибает 1,5 героя.</li>
  <li><span class="pend"></span>Стойкость босса (у Филина, можно включить любому в «Персонажах»): Уязвимость, Затуманенный разум и Слепящий свет действуют вполовину (вниз, не меньше 1), оглушение отнимает только 1 ОД в следующий ход вместо всего хода.</li>
  <li><span class="pend"></span>Поведение «охотник» (опция): после удара Филин улетает в темноту, туда, где до него дотянется меньше героев. Очень сильно: вырезает всех ≈67%, бой ≈13 раундов.</li>
  <li><span class="pend"></span>Поведение Филина — опция. «Умное» (по умолчанию): гасит только свет, который освещает героев, и не тратит на это ход, если может ударить; Птичий крик — оставшимися ОД. «По приоритетам»: ослеплён — бьёт ослепившего, пока не спадёт; иначе гасит все факелы на стенах уровня, затем на полу, затем бьёт носителя факела, затем случайного героя. С приоритетами бой превращается в долгую войну факелов (≈20 раундов) и Филин вырезает всех примерно в половине боёв.</li>
  <li><span class="pend"></span>Темнота скрывает: по цели в темноте можно действовать только с соседней клетки — атаки, заклинания и способности на цель (Вязка, Захват, Уязвимость). Стрелять, бить на 2 клетки и колдовать издалека нельзя.</li>
  <li><span class="pend"></span>Темнота слепит: кто стоит в темноте, получает −5 к физическим атакам и к защите от них; если оба в темноте, штрафы гасят друг друга. Во встречной проверке Вязки штраф получает тот, кто в темноте. Огненная стрела — магия: видимость нужна, штрафа −5 нет.</li>
  <li><span class="pend"></span>Крупное существо освещено, если освещена хоть одна его клетка. Воодушевление от света не зависит. Гнев Божий и Слепящий свет действуют на всех в радиусе.</li>
  <li><span class="pend"></span>Свет огибает угол стены, если хватает шагов: за колонной на расстоянии 3 будет светло. Если нужна тень за колоннами, понадобится вариант с линией видимости.</li>
  <li><span class="pend"></span>Отбрасывание — в гекс прямо за целью по линии от атакующего; если таких два, берётся самый прямой, никто не выбирает.</li>

function fieldVal(a,f){if(f==='reqStr')return a.req&&a.req.str||0;return a[f]==null?AF_DEF[f]:a[f];}
function dmgPreview(a,id){
  if(a.fixed!=null)return `Урон: фиксированный ${a.fixed}${a.knock?', ×2 при ударе о препятствие':''}`;
  const owner=Object.keys(T).find(k=>T[k].acts.includes(id));
  const u=owner?tmpUnit(owner):{base:{str:7,dex:7,int:7,cha:3},fract:[],effects:[],disorder:null};
  if(a.base!=null)return `${owner?esc(T[owner].name):'Пример'}: стрела ${a.base}${owner&&(T[owner].bow||1)!==1?' × лук '+fmtN(T[owner].bow):''} → урон ${[1,2,3].map(t=>rawDmg(u,a,t)).join(' / ')} до брони`;
  const dk=roleKey(u,a.dmg,'dmg'),s=stat(u,dk),l=STAT_RU[dk];
  return `${owner?esc(T[owner].name):'Пример'} (${l} ${s}): урон ${[1,2,3].map(t=>rawDmg(u,a,t)).join(' / ')} до брони`;
}
function weapCard(id){
  const a=A[id],owners=Object.keys(T).filter(k=>T[k].acts.includes(id)).map(k=>esc(T[k].name));
  const fs=AF.filter(f=>f.on(a,id)).map(f=>{
    const v=fieldVal(a,f.k),fid=`af-${id}-${f.k}`;
    if(f.t==='bool')return `<label class="fb" for="${fid}"><input type="checkbox" id="${fid}" data-a="${id}" data-f="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
    if(f.t==='stat')return `<label for="${fid}">${f.l}</label><select id="${fid}" data-a="${id}" data-f="${f.k}">${Object.entries(STAT_OPT).map(([s,l])=>`<option value="${s}" ${v===s?'selected':''}>${l}</option>`).join('')}</select>`;
    return `<label for="${fid}">${f.l}</label><input type="number" id="${fid}" class="ni" step="${f.step||1}" data-a="${id}" data-f="${f.k}" value="${v==null?'':v}"${f.t==='numOpt'?' placeholder="нет"':''}>`;
  }).join('');
  return `<div class="wcard" data-card="${id}"><div class="wh"><input type="text" class="ti" data-a="${id}" data-f="name" value="${esc(a.name)}" aria-label="Название">${DEF_A[id]?`<button type="button" data-ra="${id}" title="Вернуть значения свода">↺</button>`:`<button type="button" data-dela="${id}">Удалить</button>`}</div>
    <div class="wk">${KIND_RU[a.kind]||a.kind} · ${owners.length?owners.join(', '):'ни у кого'}${a.pending?'<div class="pend">требует утверждения</div>':''}</div>
    <div class="wf">${fs}</div>${isDmgKind(a)?`<div class="wd" id="wd-${id}">${dmgPreview(a,id)}</div>`:''}</div>`;
}

function setAF(id,f,i){
  const a=A[id];if(!a)return false;
  if(i.type==='checkbox'){a[f]=i.checked;if(f==='ranged'&&i.checked){if(a.range==null)a.range=3;if(a.noAdj==null)a.noAdj=true;if(!a.fx)a.fx='bolt';}return true;}
  if(i.tagName==='SELECT'){a[f]=i.value;return true;}
  if(f==='name'){a.name=i.value.trim()||a.name;return true;}
  if(i.value===''){if(f==='fixed'){a.fixed=null;return true;}if(f==='reqStr'){a.req=null;return true;}i.value=fieldVal(a,f)??'';return false;}
  let v=parseFloat(String(i.value).replace(',','.'));if(isNaN(v)){i.value=fieldVal(a,f)??'';return false;}
  if(f==='K')v=Math.max(.25,v);
  if(['cost','rolls','reach','range','dur','radius','minT','gdmg','cdmg','hpBelow','fixed','pierce','mag','cd','dc','off','crit','turns','defPen','pierceMin','pts','base','ammo','sneak','trip','tdmg','atkB','strB','defP'].includes(f))v=Math.max(['rolls','reach','range','dur','minT','turns'].includes(f)?1:0,Math.round(v));
  if(f==='reqStr'){a.req=v>0?{str:Math.round(v)}:null;return true;}
  if(f==='penalty')v=Math.round(v);
  a[f]=v;i.value=v;return true;
}
function markActOwners(id){for(const [k,t] of Object.entries(T))if(t.acts.includes(id))DATA_DIRTY.add(k);}
function bindDataTab(){
  const box=$('#dataBody'),msg=t=>{const m=$('#ioMsg');if(m)m.textContent=t;};
  box.querySelectorAll('[data-t][data-f]').forEach(i=>i.onchange=()=>{
    const k=i.dataset.t,f=i.dataset.f,t=T[k];if(!t)return;
    if(i.type==='number'){
      if(i.value===''){if(f==='will')t.will=null;else{i.value=t[f]??({baseDef:6,size:1,adr:1,bandages:0,torches:0,traps:0,bow:1}[f]??0);return;}}
      else{const v=parseFloat(String(i.value).replace(',','.'));if(isNaN(v)){i.value=t[f]??'';return;}t[f]=f==='hp'?Math.max(1,Math.round(v)):f==='size'?Math.min(2,Math.max(1,Math.round(v))):f==='bow'?Math.max(.25,Math.round(v*4)/4):['adr','bandages','torches','traps'].includes(f)?Math.max(0,Math.round(v)):Math.round(v);i.value=t[f];}
    }else if(i.type==='checkbox')t[f]=i.checked;
    else if(f==='glyph')t.glyph=i.value.trim().slice(0,2)||'?';
    else if(f==='name'){t.name=i.value.trim()||t.name;i.value=t.name;}
    else t[f]=i.value;
    DATA_DIRTY.add(k);saveData();updDerived(k);
  });
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=b.dataset.rm;T[k].acts=T[k].acts.filter(x=>x!==b.dataset.id);DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-add]').forEach(sel=>sel.onchange=()=>{const k=sel.dataset.add,id=sel.value;if(!id)return;const acts=T[k].acts.filter(x=>x!=='escape');acts.push(id,'escape');T[k].acts=acts;DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{const k=b.dataset.rt;T[k]=clone(DEF_T[k]);T[k].acts=T[k].acts.filter(id=>A[id]);DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-delt]').forEach(b=>b.onclick=()=>{const k=b.dataset.delt;delete T[k];DATA_DIRTY.add(k);saveData();renderDataTab();});
  const ba=$('#bdefAllGo');if(ba)ba.onclick=()=>{const v=Math.round(parseFloat(String($('#bdefAll').value).replace(',','.')));if(isNaN(v))return;for(const [k,t] of Object.entries(T)){t.baseDef=v;DATA_DIRTY.add(k);}saveData();renderDataTab();$('#bdefAll').value=v;};
  const nc=$('#newChar');if(nc)nc.onclick=()=>{const k='c'+Date.now().toString(36);T[k]={name:'Новый боец',glyph:'?',side:'en',str:5,dex:5,int:5,cha:3,will:0,hp:12,armor:0,shield:0,baseDef:6,speed:3,torches:2,bandages:0,acts:['move','improv','throwTorch','escape'],ai:'dumb'};saveData();renderDataTab();const tw=$('#dataBody .tblwrap');if(tw)tw.scrollTop=tw.scrollHeight;};
  box.querySelectorAll('[data-a][data-f]').forEach(i=>i.onchange=()=>{
    const id=i.dataset.a,f=i.dataset.f;if(!setAF(id,f,i))return;saveData();
    if(i.type==='checkbox'||i.tagName==='SELECT'||REFRESH_FIELDS.includes(f)||f==='name'){const c=box.querySelector(`[data-card="${id}"]`);if(c){c.outerHTML=weapCard(id);bindDataTab();}}
    else{const w=document.getElementById('wd-'+id);if(w)w.innerHTML=dmgPreview(A[id],id);}
    if(S&&!S.sim)render();
  });
  box.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{const id=b.dataset.ra;A[id]=clone(DEF_A[id]);saveData();renderDataTab();render();});
  box.querySelectorAll('[data-dela]').forEach(b=>b.onclick=()=>{const id=b.dataset.dela;markActOwners(id);for(const t of Object.values(T))t.acts=t.acts.filter(x=>x!==id);delete A[id];saveData();renderDataTab();render();});
  const nw=$('#newWeap');if(nw)nw.onclick=()=>{const id='w'+Date.now().toString(36);A[id]={name:'Новое оружие',cost:1,kind:'attack',atk:'main',dmg:'main',K:2,reach:1};saveData();renderDataTab();const c=box.querySelector(`[data-card="${id}"] input`);if(c){c.focus();c.select();}};
  const cp=$('#ioCopy');if(cp)cp.onclick=()=>{const ta=$('#ioText');const ok=()=>msg('Скопировано');const fb=()=>{ta.focus();ta.select();msg('Текст выделен — нажмите Ctrl+C');};try{navigator.clipboard.writeText(ta.value).then(ok,fb);}catch(e){fb();}};
  const ld=$('#ioLoad');if(ld)ld.onclick=()=>{try{mergeData(JSON.parse($('#ioText').value));DATA_ALL=true;saveData();msg('Загружено. Бой начнётся заново, когда вы закроете окно.');render();}catch(e){msg('Не удалось загрузить: '+(e.message||'текст не похож на сохранённые значения'));}};
  const rs=$('#ioReset');if(rs)rs.onclick=()=>{mergeData({T:{},A:{}});DATA_ALL=true;saveData();$('#ioText').value=JSON.stringify({v:DATA_V,T,A});msg('Все значения возвращены к своду. Бой начнётся заново, когда вы закроете окно.');render();};
}
function applyTemplates(){
  if(!DATA_DIRTY.size&&!DATA_ALL){render();return;}
  const all=DATA_ALL,dirty=new Set(DATA_DIRTY);DATA_DIRTY.clear();DATA_ALL=false;
  const fix=list=>list.filter(u=>T[u.tpl]).map(u=>{
    if(!all&&!dirty.has(u.tpl))return u;
    const t=T[u.tpl],old=u.tname||t.name,suffix=u.name.startsWith(old)?u.name.slice(old.length):'';
    Object.assign(u.base,{str:t.str,dex:t.dex,int:t.int,cha:t.cha});
    Object.assign(u,{size:t.size||1,adr:t.adr==null?1:t.adr,nv:!!t.nightVision,resist:!!t.resist,traps:t.traps||0,ammo:ammoOf(t),wield:weaponsOf(t)[0]||null,bow:t.bow||1,freeReload:!!t.freeReload,bandages:t.bandages||0,torches:Math.max(0,(t.torches||0)-(u.torch?1:0)),maxHp:t.hp,hp:t.hp,armor:t.armor,shield:t.shield||0,bdef:t.baseDef==null?6:t.baseDef,will:t.will,glyph:t.glyph,acts:t.acts.filter(id=>A[id]),ai:t.ai,name:t.name+suffix,tname:t.name});
    return u;
  });
  if(S.editor){S.units=fix(S.units);render();log('<div class="lb">Значения персонажей обновлены</div>','sys');return;}
  const snap=S.initial;snap.units=fix(snap.units);startGame(snap);
  log('<div class="lb">Значения персонажей обновлены, бой начат заново</div>','sys');
}

/* ================= ЗАПУСК ================= */
function startGame(snap){
  GEN++;closePrompt(null);hideTip();
  S=buildState(snap);
  $('#log').innerHTML='';$('#fx').innerHTML='';$('#banner').hidden=true;$('#banner').dataset.closed='';$('#banner').dataset.over='';
  $('#btnEditor').classList.remove('on');
  layoutBoard();
  const sc=SCN[S.scn];
  log(`<div class="lb">Сценарий: ${sc?sc.name:'своя расстановка'}</div>`,'sys');
  initCombat();
  const first=S.units.find(u=>u.side==='pc');S.sel=first?first.id:null;
  render();
  S.busy=true;
  phaseLoop().catch(e=>{if(e!==CANCEL)console.error(e);});
}
function loadScenario(id){$('#scn').value=id;startGame(parseScenario(id));}
function restart(){if(SIMULATING)return;startGame(S.initial);}

function init(data){
  loadData();
  $('#scn').innerHTML=Object.entries(SCN).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  $('#scn').onchange=e=>{if(!SIMULATING)loadScenario(e.target.value);};
  $('#btnRestart').onclick=restart;
  $('#btnEditor').onclick=()=>toggleEditor(!S.editor);
  $('#btnOdds').onclick=openOdds;$('#btnSim').onclick=openSim;$('#btnRules').onclick=openRules;$('#btnNotes').onclick=openNotes;$('#btnData').onclick=()=>{if(!SIMULATING)openData();};
  $('#btnClearLog').onclick=()=>{$('#log').innerHTML='';S.log=[];};
  $('#modal').onclick=e=>{if(e.target.id==='modal'&&!SIMULATING)closeModal();};
  const hl=$('#hl');
  hl.addEventListener('click',onCellClick);
  hl.addEventListener('mousemove',onCellHover);
  hl.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderHL();});
  hl.addEventListener('contextmenu',e=>{e.preventDefault();if(S.act){S.act=null;hideTip();render();}});
  document.addEventListener('keydown',e=>{
    if(!$('#prompt').hidden)return;
    if(e.key==='Escape'){if(!$('#modal').hidden&&!SIMULATING){closeModal();return;}if(S.act){S.act=null;hideTip();render();}return;}
    if(!$('#modal').hidden||e.target.matches('input,select'))return;
    if(e.key==='Enter'){onEndTurn();e.preventDefault();return;}
    if(/^[1-9]$/.test(e.key)){const b=$('#acts').querySelectorAll('[data-act]')[+e.key-1];if(b&&!b.disabled)b.click();}
  });
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S)layoutBoard();},120);});
  requestAnimationFrame(loop);
  const lay=data&&data.layout&&data.layout.units?data.layout:null;
  if(lay&&data.bal===BAL_V){$('#scn').value=lay.scn||'guard';startGame(lay);}
  else if(lay&&SCN[lay.scn]){loadScenario(V2()?'dummies':lay.scn);log('<div class="lb">Баланс обновился: сценарий собран заново с новыми значениями</div>','sys');}
  else loadScenario(V2()?'dummies':'guard');
  if(OLD_DATA)log('<div class="lb">Сохранённые в браузере значения персонажей и оружия сброшены: баланс обновился. Теперь браузер хранит только ваши изменения, и новые значения свода до них доходят</div>','sys');
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({bal:BAL_V,layout:S?JSON.parse(JSON.stringify(S.initial)):null}));}catch(e){}}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(init);else init((hot&&hot.data)||{});
</script>
</body>
