<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полигон подземелья 4.5 · Боль · наш баланс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Oranienbaum&family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Склеп ночью: холодный сланец, костяной текст и одно пламя. Герои — патина, враги — запёкшаяся кровь.
     Раскладка: слева состав по сторонам, в центре поле и под ним панель действий, справа лист бойца и журнал бросков. */
  --ink:#0a0c10; --slab:#11151a; --slab-2:#171c23; --slab-3:#1f2630; --rule:#2a323d;
  --bone:#e8e3d5; --ash:#8a93a0; --flame:#f0a23b; --patina:#62b5a2; --blood:#d4573f; --arcane:#b9a0e6;
  --good:#7fb26b; --warn:#e2b54c; --bad:#e2634c;
  --display:"Oranienbaum","Cormorant Garamond",Georgia,serif;
  --body:"Sofia Sans","Segoe UI",system-ui,sans-serif;
  --cond:"Sofia Sans Condensed","Arial Narrow","Segoe UI",sans-serif;
  --mono:"Martian Mono","JetBrains Mono",ui-monospace,Consolas,monospace;
  --cell:46px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:var(--bone);background:var(--slab-2);border:1px solid var(--rule);border-radius:3px;padding:6px 10px}
button,select{cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:#4d5a6a}
:focus-visible{outline:2px solid var(--flame);outline-offset:1px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--flame);border-color:var(--flame);color:#1b1205;font-weight:700}
button.primary:hover:not(:disabled){filter:brightness(1.1)}
button.on{border-color:var(--flame);color:var(--flame)}
input[type=number]{width:58px;padding:3px 5px;font-family:var(--mono);font-size:12px}
input[type=checkbox],input[type=radio]{accent-color:var(--flame);padding:0}
[aria-pressed="true"]{color:var(--flame)!important;border-color:var(--flame)!important;background:rgba(240,162,59,.09)!important}
kbd{font:400 10px var(--mono);border:1px solid var(--rule);border-radius:2px;padding:0 4px;background:var(--ink);color:var(--ash)}
.dim{color:var(--ash)}
.nm.pc{color:#8fd2c0}.nm.en{color:#f09a86}
.pend{font-size:11px;color:var(--arcane);letter-spacing:.02em}
.pend::before{content:"⚑ "}
.help{font-size:12.5px;color:var(--ash)}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
header.top{display:flex;gap:8px 16px;align-items:center;min-width:0;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--slab)}
.brand h1{font:400 21px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;margin:0;white-space:nowrap}
.brand .sub{display:block;font:600 10.5px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin-top:4px}
.scene{display:flex;gap:6px;align-items:center}
.scene label,.cap{font:600 10.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.scene select{max-width:230px}
.tools{display:flex;gap:2px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tools button{border-color:transparent;background:transparent;color:var(--ash);font:600 12.5px var(--cond);letter-spacing:.07em;text-transform:uppercase;padding:7px 9px;white-space:nowrap}
.tools button:hover:not(:disabled){color:var(--bone);background:var(--slab-2)}
.tools button.on{color:var(--flame);border-color:var(--flame)}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 350px;min-height:0}
.rail{min-height:0;overflow:auto;border-right:1px solid var(--rule);background:var(--slab);padding:10px;display:flex;flex-direction:column;gap:14px}
#roster{display:flex;flex-direction:column;gap:14px}
.rg{display:flex;flex-direction:column;gap:2px}
.rgh{display:flex;align-items:baseline;gap:8px;font:600 10.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ash);padding:0 2px 4px;border-bottom:1px solid var(--rule);margin-bottom:3px}
.rg.pc .rgh span:first-child{color:var(--patina)}.rg.en .rgh span:first-child{color:var(--blood)}
.rgh .cnt{font:400 10px var(--mono);letter-spacing:0}
.rgh .now{margin-left:auto;color:var(--flame)}
.ru{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:8px;row-gap:3px;align-items:center;text-align:left;padding:6px 8px 6px 6px;background:transparent;border:1px solid transparent;border-left:2px solid transparent;border-radius:3px}
.ru .g{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--cond)}
.ru.pc .g,.gl.pc{background:#1d3b35;color:#c5ebdf;box-shadow:inset 0 0 0 1.5px var(--patina)}
.ru.en .g,.gl.en{background:#43190f;color:#f8d3c8;box-shadow:inset 0 0 0 1.5px var(--blood)}
.ru .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;align-items:center}
.pips b{width:7px;height:7px;border-radius:50%;background:var(--flame)}
.pips b.off{background:#2e3743}
.pips b.ad{border-radius:1px;transform:rotate(45deg) scale(.9);background:var(--patina);margin-left:2px}
.pips b.ad.off{background:#2e3743}
.ru .mb{grid-column:2;height:4px;background:#05070a;border-radius:2px;overflow:hidden}
.ru .mb i{display:block;height:100%}
.ru .hpn{grid-column:3;font:400 10.5px var(--mono);text-align:right}
.hpn i,.v i{font-style:normal;color:var(--ash);font-weight:400}
.ru .st{grid-column:2/4;font-size:12px;line-height:1.15;letter-spacing:1px;color:var(--ash)}
.ru .st:empty{display:none}
.ru:hover{background:var(--slab-2)}
.ru.sel{background:var(--slab-3);border-color:var(--rule);border-left-color:var(--flame)}
.ru.spent .nm{color:var(--ash)}
.ru.down{opacity:.4}.ru.down .nm{text-decoration:line-through}
.scene-card{margin-top:auto;border-top:1px solid var(--rule);padding-top:8px;font-size:12.5px;line-height:1.4;color:var(--ash)}
.scene-card summary,details.sec summary{cursor:pointer;font:600 10.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.scene-card p{margin:6px 0 0}
.scene-card p:first-of-type{color:var(--bone)}

.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.ctx{display:flex;align-items:center;gap:14px;padding:7px 14px;border-bottom:1px solid var(--rule);min-height:46px}
.ctx .rnd{display:flex;align-items:baseline;gap:7px}
.ctx .rn{font:400 27px/1 var(--display);min-width:1.1em}
.ctx .ph{font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:2px;white-space:nowrap}
.ctx .ph.pc{background:#16332d;color:#aee0d2}.ctx .ph.en{background:#3d1810;color:#f5c2b4}.ctx .ph.over{background:var(--flame);color:#1b1205}
.ctx .pr{flex:1;min-width:0;color:var(--ash);font-size:13.5px}
.ctx .pr b{color:var(--bone);font-weight:600}
.ctx .tg,.logf{display:flex;gap:4px}
.tg button,.logf button{font:600 11.5px var(--cond);letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;color:var(--ash);background:transparent;white-space:nowrap}

.board-wrap{flex:1;min-height:0;display:flex;overflow:auto;padding:10px;background:radial-gradient(ellipse at 50% 42%,#141a22 0,var(--ink) 72%)}
#board{position:relative;flex:none;margin:auto;box-shadow:0 0 0 1px #000,0 20px 50px rgba(0,0,0,.65)}
#board canvas{position:absolute;left:0;top:0;pointer-events:none}
#hl{position:absolute;left:0;top:0;overflow:visible}
#hl .c{fill:transparent;stroke:none;pointer-events:all;transition:fill .08s}
#hl .c:hover{stroke:rgba(232,227,213,.28);stroke-width:1}
#hl .c.selc{stroke:var(--flame);stroke-width:1.5;stroke-opacity:.6}
#hl .c.zoc{fill:rgba(212,87,63,.06);stroke:rgba(212,87,63,.55);stroke-width:1.1;stroke-dasharray:3 3}
#hl .c.mv1{fill:rgba(98,181,162,.26);stroke:rgba(98,181,162,.6);stroke-width:1;stroke-dasharray:none;cursor:pointer}
#hl .c.mv2{fill:rgba(98,181,162,.1);stroke:rgba(98,181,162,.3);stroke-width:1;stroke-dasharray:none;cursor:pointer}
#hl .c.zw{stroke:rgba(236,104,80,.95);stroke-width:1.5;stroke-dasharray:4 3}
#hl .c.rng{fill:rgba(240,162,59,.09)}
#hl .c.path{fill:rgba(240,162,59,.42)}
#hl .c.tgt{fill:rgba(240,162,59,.16);stroke:var(--flame);stroke-width:2;stroke-dasharray:none;cursor:crosshair}
#hl .c.ally{stroke:var(--patina);stroke-width:2;stroke-dasharray:none;cursor:pointer}
#hl .c.arcpick{stroke:rgba(212,87,63,.85);stroke-width:1.2;stroke-dasharray:none;cursor:crosshair}
#hl .c.arc{fill:rgba(212,87,63,.42)}
#hl .c.ed{cursor:cell}
#hl .c.ed:hover{stroke:var(--bone);stroke-width:2}
#toks,#fx,#fc{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .09s linear}
.tok .ring{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(var(--hpc,var(--good)) calc(var(--hp,1)*1turn),rgba(0,0,0,.8) 0);box-shadow:0 3px 8px rgba(0,0,0,.85)}
.tok .disc{position:absolute;inset:15%;border-radius:50%;display:grid;place-items:center;font:700 calc(var(--cell)*.3)/1 var(--cond)}
.tok.pc .disc{background:radial-gradient(circle at 35% 28%,#3f7a6c,#1c3f38 62%,#102622);color:#d9f3ea}
.tok.en .disc{background:radial-gradient(circle at 35% 28%,#a23d28,#5a1c10 62%,#35100a);color:#fbe0d6}
.tok.big .ring{inset:2%}.tok.big .disc{inset:9%;font-size:calc(var(--cell)*.38)}
.tok.s2{width:calc(var(--cell)*1.8);height:calc(var(--cell)*1.8)}
.tok.s2 .ring{inset:6%}.tok.s2 .disc{inset:10%;font-size:calc(var(--cell)*.62)}
.tok.sel .ring{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--flame),0 0 18px rgba(240,162,59,.7)}
.tok.peek .ring{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--bone)}
.tok.spent .disc{filter:saturate(.4) brightness(.78)}
.tok.down{opacity:.3;filter:grayscale(1)}
.tok.down .disc::after{content:"✝";position:absolute;font-size:calc(var(--cell)*.5);color:#ddd}
.tok .hp{display:none}
.tok .od{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);display:flex;gap:2px;align-items:center}
.tok .od b{width:6px;height:6px;border-radius:50%;background:var(--flame);box-shadow:0 0 0 1.5px #000}
.tok .od b.off{background:#3a4450}
.tok .od b.ad{background:var(--patina);border-radius:1px;transform:rotate(45deg) scale(.85)}
.tok .bd{position:absolute;top:-4px;right:-5px;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:80%;font-size:calc(var(--cell)*.24);line-height:1;filter:drop-shadow(0 1px 1px #000)}
.tok.hit .disc{animation:hit .38s}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.86);filter:brightness(2.2)}100%{transform:scale(1)}}
.fcb{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:baseline;gap:4px;background:rgba(10,12,16,.93);border:1px solid var(--flame);border-radius:3px;padding:1px 5px;font:600 11px var(--mono);white-space:nowrap;box-shadow:0 2px 8px #000}
.fcb i{font-style:normal;font-weight:400;color:var(--ash);font-size:10px}
.fcb.lo{border-color:var(--bad)}.fcb.hi{border-color:var(--good)}
.fxt{position:absolute;font:600 14px var(--mono);text-shadow:0 1px 2px #000,0 0 6px #000;animation:rise 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.fxt.dmg{color:#ff8a6b}.fxt.miss{color:var(--ash)}.fxt.info{color:var(--warn)}.fxt.heal{color:var(--good)}
@keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-30px}}
.fxl{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;animation:fade .5s ease-out forwards}
.fxl.fire{background:linear-gradient(90deg,rgba(255,180,80,0),#ffb050 70%,#fff2c0)}
.fxl.bolt{background:linear-gradient(90deg,rgba(220,220,200,0),#ddd 80%)}
.fxl.melee{background:linear-gradient(90deg,rgba(255,120,90,0),#ff7a5a)}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,13,.6);pointer-events:auto}
.banner .bx{background:var(--slab);border:1px solid var(--rule);border-top:2px solid var(--flame);padding:22px 30px;text-align:center;box-shadow:0 20px 60px #000}
.banner h2{font:400 32px var(--display);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}

.dock{border-top:1px solid var(--rule);background:var(--slab)}
#acts{padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.ag,.agt{display:contents}
.agh{display:flex;gap:4px;flex:0 1 auto;min-width:0}
.agn{writing-mode:vertical-rl;transform:rotate(180deg);font:600 9.5px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ash);text-align:center;width:15px;margin-left:5px;border-right:1px solid var(--rule)}
.ag:first-child .agn{margin-left:0}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;align-content:space-between;flex:0 1 126px;min-height:46px;text-align:left;padding:5px 7px 4px;background:var(--slab-2)}
.act .n{font:600 12.5px/1.12 var(--cond);letter-spacing:.01em;overflow-wrap:break-word;hyphens:auto}
.act .c{display:flex;gap:2px;padding-top:3px}
.act .c b{width:7px;height:7px;border-radius:50%;background:var(--flame)}
.act .c b.z{background:transparent;border:1px solid var(--ash)}
.act .m{font-size:10.5px;line-height:1.2;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .m em{font-style:normal;color:var(--warn)}
.act .k{font:400 9.5px var(--mono);color:var(--ash);text-align:right;align-self:end}
.act:hover{background:var(--slab-3)}
.act.sel{border-color:var(--flame);background:rgba(240,162,59,.12);box-shadow:inset 0 -2px 0 var(--flame)}
.act.off{opacity:.5}.act.off .c b{background:var(--ash)}
.act.pd .n::after{content:" ⚑";color:var(--arcane);font-size:10px}
.hint{flex-basis:100%;font-size:12.5px;line-height:1.35;color:var(--ash);min-height:2.8em;border-top:1px dashed var(--rule);padding-top:6px;margin-top:3px}
.hint b{color:var(--bone)}
.hint .cost{font:400 11px var(--mono);color:var(--flame);margin:0 4px}
.hint .why{color:var(--warn)}
.dock-empty{color:var(--ash);padding:12px 2px}
.ctx .end{padding:7px 12px;font:700 12.5px var(--cond);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.ctx .end kbd{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.3);color:#1b1205;margin-left:6px}
.dockft{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;color:var(--ash)}
.lk{background:none;border:0;padding:0;color:var(--patina);text-decoration:underline;font-size:12px}
.ghost{background:transparent;color:var(--ash);font-size:12px;padding:3px 8px;margin-left:auto}
.panel{flex-basis:100%}
h2.ph{font:600 10.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin:0 0 6px}
.ed-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.ed-tools button{font-size:12.5px;padding:5px 8px;text-align:left}
.ed-tools button.on{background:rgba(240,162,59,.12)}
.edrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
.edstats{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:6px}

.side{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--rule);background:var(--slab)}
.sheet{padding:12px;border-bottom:1px solid var(--rule);overflow:auto;flex:0 1 auto;max-height:62%}
.sheet-empty h2{font:400 20px var(--display);margin:0 0 4px}
.sheet-empty p{margin:0;color:var(--ash);font-size:13px}
.sh-hd{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.gl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--cond)}
.sheet .nm{font:400 22px/1.05 var(--display)}
.sheet .sd{font-size:12px;color:var(--ash);margin-top:2px}
.sh-od{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.hpline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:10px 0 8px}
.bar{height:6px;background:#05070a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.hpline .v{font:600 13px var(--mono)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.stats div{background:var(--slab-2);padding:5px 2px 4px;text-align:center}
.stats b{display:block;font:600 16px/1.15 var(--mono)}
.stats span{font:600 10px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ash)}
.stats .low b{color:var(--bad)}.stats .der b{color:var(--flame)}
.wounds{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.wc{border:1px solid var(--rule);border-radius:2px;text-align:center;padding:2px 0 3px;background:var(--slab-2)}
.wc span{display:block;font:600 9.5px var(--cond);letter-spacing:.03em;color:var(--ash);text-transform:uppercase;white-space:nowrap}
.wc b{font:600 12px var(--mono);color:#4b5664}
.wc.d1{border-color:var(--warn)}.wc.d1 b{color:var(--warn)}
.wc.d2{border-color:#e58a4a}.wc.d2 b{color:#e58a4a}
.wc.d3,.wc.d4{border-color:var(--bad)}.wc.d3 b,.wc.d4 b{color:var(--bad)}
.wc.open{background:rgba(226,99,76,.16)}
.wc.fr{border-style:dashed;border-color:var(--bad)}
.wc.bl.open b{color:var(--bad)}
.inv{font-size:12px;color:var(--ash);margin-top:8px}
.inv b{color:var(--bone);font:600 12px var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;border:1px solid var(--rule);background:var(--slab-2);white-space:nowrap}
.chip.st{white-space:normal;line-height:1.3;padding:2px 7px}
.chip.crit{background:#4b300b;border-color:var(--flame);color:#ffdca6}
.chip.enh{background:#27401f;border-color:#7da35d;color:#d6f0bf}
.chip.ok{background:#1c2e1a;border-color:#54733f;color:#cfe5bb}
.chip.minor{color:var(--ash)}
.chip.fail{background:#35140f;border-color:#7a2d20;color:#f0b5a6}
.chip.cfail{background:#551209;border-color:var(--bad);color:#ffd0c4}
.dis{font-size:12.5px;color:var(--warn);margin-top:8px;line-height:1.35}
details.sec{margin-top:9px;border-top:1px solid var(--rule);padding-top:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:7px 0 0}
.kv dt{color:var(--ash)}.kv dd{margin:0}.kv dd b{font:600 12px var(--mono)}
.willrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:7px;font-size:13px}
.willrow button{padding:1px 7px;font:400 11.5px var(--mono)}
.willrow select{padding:2px 4px;font-size:12.5px;max-width:100%}
.logbox{flex:1 1 0;min-height:150px;display:flex;flex-direction:column}
.loghead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--rule)}
.loghead h2{font:600 10.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin:0}
.logf{margin-left:auto}
.logf button{padding:3px 7px;letter-spacing:.05em}
#btnClearLog{font-size:12px;line-height:1.3;padding:3px 8px;color:var(--ash);background:transparent}

const ATTACK_KINDS=['attack','arc','circle','grab'];
function hintOf(id,a){
  const r=n=>n===1?'раунд':n>=2&&n<=4?'раунда':'раундов';
  switch(id){
    case 'cover':return `Соседний союзник, ${a.dur} ${r(a.dur)}: перехват одной атаки (кроме площадных), если атакующий может с той же позиции атаковать и вас`;
    case 'vuln':return `Видимая цель: d20 + Интуиция против базовой защиты + Интуиции цели. −Интуиция / ${fmtN(a.K)} по степени к пассивной и активной защите, ${a.turns} хода цели; броня не меняется, повтор обновляет срок`;
    case 'cloud':return `Цель на виду: d20 + Интуиция против ${a.dc}. −Интуиция / ${fmtN(a.K)} по степени к атакам и способностям цели, ${a.turns} хода цели; повтор обновляет срок`;
    case 'throwTorch':return `Зажечь факел из запаса и бросить на пол в пределах ${a.range} кл. по линии видимости. Горит, пока не погасят`;
    case 'throwHeld':return `Горящий факел из рук — на пол в пределах ${a.range} кл. по линии видимости. Вы перестаёте быть носителем факела`;
    case 'bandage':return `1 бинт = ${a.pts} лечебных пункта: сначала по 1 на стак кровотечения, потом по 1 на открытую рану. Себе или соседу`;
    case 'limbGrab':return `${a.gdmg} урона сразу, ${a.gdmg} на следующем ходу, затем бросок о стену: ${a.gdmg} урона и перелом`;
    case 'jailerGrab':return `Цель не двигается и не защищается активно; ${a.gdmg} урона в каждый ход тюремщика`;
    case 'shriek':return `−${a.mag} Воли героям в радиусе ${a.radius}; нужно ≥${a.minT} героя рядом, перезарядка ${a.cd||0}`;
    case 'counter':return `До своего хода: успешный блок/парирование наносит атакующему рану руки с оружием (по правилам ран) и ${a.cdmg} урона сквозь броню`;
    case 'knifeExtra':return PAIN()?`На исходе Боли: одна дополнительная атака за ход без ОД`:`HP ниже ${a.hpBelow}: одна дополнительная атака за ход без ОД`;
    case 'bind':return `Соседний враг: встречная Сила, ничья в пользу цели. Цель не двигается и не бьёт связанным оружием до вашего следующего хода, защита −${a.defPen}. Вы не атакуете, движение снимает Вязку. Перезарядка ${a.cd}${a.cdOnlySuccess?' — только после успеха':''}`;
    case 'blindlight':return `d20 + Интуиция против ${a.dc}: свет = Интуиция / ${fmtN(a.K)} по степени, ослепление на ${a.off} меньше (мин. 1): −${a.mag} к атакам всем, кроме вас, до вашего следующего хода`;
    case 'wrath':return `d20 + Интуиция + Харизма против ${a.dc}: урон Воле (Инт + Хар) / ${fmtN(a.K)} по степени врагам в радиусе ${a.radius}. Перезарядка ${a.cd}`;
    case 'inspire':return `Союзник в пределах ${a.range} кл.: d20 + Харизма против ${a.dc}, +Харизма / ${fmtN(a.K)} по степени ко всем броскам до конца его ${a.turns}-го хода; одна цель за раз`;
    case 'smash':return 'Соседняя клетка стены, двери или решётки разрушается сразу';
    case 'mend':return `Себе или соседу: d20 + Интуиция против ${a.dc}, пунктов = Интуиция / ${fmtN(a.K)} по степени. Пункт снимает стак кровотечения, затем закрывает открытую рану, затем смягчает закрытую серьёзную или тяжёлую рану на ступень. HP не лечит`;
    case 'psalm':return `Голос: d20 + Харизма против ${a.dc}. Союзникам в радиусе ${a.radius} (и себе) +Харизма / ${fmtN(a.K)} по степени к пассивной и активной защите до вашего хода. Сквозь стены. Перезарядка ${a.cd}`;
    case 'voice':return `Голос: d20 + Харизма против ${a.dc}. Каждому врагу в радиусе ${a.radius} урон Харизма / ${fmtN(a.K)} по степени, броня не защищает. Сквозь стены. Перезарядка ${a.cd}`;
    case 'mark':return `Видимая цель: d20 + Интуиция против ${a.dc}. Атаки всех героев по ней игнорируют 1 / 2 / 3 брони по степени, пока цель в бою. Одна метка за раз`;
    case 'trap':return `Соседняя пустая клетка. Враг, вошедший в неё: ${a.tdmg} урона без брони, стак кровотечения и не может двигаться, пока не вырвется (1 ОД, Сила против ${a.dc}). Крупного (2×2) не держит. Запас на бой — в карточке`;
    case 'dash':return `До скорости клеток к врагу и сразу удар: ${A[a.with]?A[a.with].name:''}. Всё за 1 ОД. Перезарядка ${a.cd}`;
    case 'veil':return `Клетка в пределах ${a.range} по линии видимости: d20 + Интуиция против ${a.dc}. Облако радиуса 1 (крит — 2) до конца следующего раунда: кто внутри, того видно и можно достать только с соседней клетки, и сам он действует только на соседей. Ночное зрение не помогает. Перезарядка ${a.cd}`;
    case 'stepback':return 'После атаки в этот ход: шаг на 1 клетку без ОД, один раз за ход';
    case 'bowFire':return `Клетка пола в пределах ${a.range} по линии видимости загорается и светит, как брошенный факел. Запас на бой — в карточке`;
    case 'evade':return `Освобождает из захвата, Вязки и капкана без броска, затем перемещение до скорости. До своего хода +${a.mag} к защите. Перезарядка ${a.cd}`;
    case 'rage':return `${a.turns>1?`До конца ${a.turns}-го своего хода`:'До конца следующего своего хода'}: +${a.atkB} к атакам, Сила +${a.strB}, защита −${a.defP}, штрафы ран не действуют; при 0 HP не падает, пока длится ярость. Перезарядка ${a.cd}`;
    case 'taunt':return 'Видимый враг: d20 + Харизма против базовой защиты + Интуиции цели. В свой следующий ход он атакует Шута, если может, иначе идёт к нему';
    case 'ditty':return `Голос: d20 + Харизма против ${a.dc}. Союзникам в радиусе ${a.radius} (и себе) +Харизма / ${fmtN(a.K)} по степени к атакам до конца их следующего хода. Сквозь стены. Перезарядка ${a.cd}`;
    case 'trip':return `Без урона. При попадании цель сбита с ног: −${a.trip} к защите до конца своего следующего хода`;
    case 'order':return `Союзник в пределах ${a.range} кл. (голос, сквозь стены): d20 + Харизма против ${a.dc}. При успехе союзник сразу бьёт лучшим доступным ударом вне очереди, без ОД. Перезарядка ${a.cd}`;
    case 'swap':return 'Соседний союзник; ОД тратит только тот, кто меняется';
    case 'door':return 'Соседняя дверь; запертую не открыть, занятую не закрыть';
    case 'breakbind':return 'Встречная Сила, ничья в пользу Инквизитора; после — только движение';
    case 'unbind':return 'Бесплатно; перемещение тоже снимает Вязку';
  }
  let h=a.hint||'';
  if(a.sneak)h+=(h?'; ':'')+`исподтишка (цель рядом с другим союзником, или вы в темноте, или в Завесе): +${a.sneak} к атаке и степень выше`;
  if(a.numb)h+=(h?'; ':'')+'при попадании цель онемеет: следующий ход с 1 ОД';
  if(a.ammo)h+=(h?'; ':'')+`запас ${a.ammo} на бой`;
  if(a.cd&&!['bind','wrath'].includes(id))h+=(h?'; ':'')+`перезарядка ${a.cd}`;
  const once=a.once&&!(id==='blades'&&SET.owlTwice);
  if((a.rolls||1)>1)h=`${a.rolls} броска за 1 ОД${once?', один раз за ход':', можно дважды за ход (опция)'}`+(h?'; '+h:'');
  else if(once)h='один раз за ход'+(h?'; '+h:'');
  return h;
}

/* ================= СВЕТ И ТЕМНОТА ================= */
/* Свет течёт по клеткам без диагоналей: ромб радиуса R (крест по R клеток и всё между концами). Стены и закрытые двери не пропускают. */
const TORCH_R=4;
let _lc={sig:'',grid:null,S:null};
function lightSources(){
  const L=[];
  const TR=SET.torchR||(SET.hex?3:TORCH_R);for(const t of S.torches)if(t.lit)L.push({x:t.x,y:t.y,r:TR});

/* Кэш: версия карты света S.lv растёт при изменении факелов, дверей и стен; носители света учитываются по позициям. */
function lightSig(){
  let h=((S.lv||0)*1000003+S.walls.size*131+S.torches.length*17)|0;
  for(const u of S.units)if(!u.down&&(u.torch||u.flash))h=(h*31+u.x*97+u.y*13+(u.flash?u.flash.r*7:0)+sz(u)+(u.torch?3:0))|0;
  return h;
}
function lightGrid(){
  const sig=lightSig();

  const L=lightSources();
  const g=new Uint8Array(S.w*S.h),extra=0;
  for(const l of L){
    const starts=l.u?cellsOf(l.u):[{x:l.x,y:l.y}],dist=new Map(),q=[];
    for(const c of starts){dist.set(key(c.x,c.y),0);q.push([c.x,c.y]);}
    let qi=0;
    while(qi<q.length){
      const [x,y]=q[qi++],d=dist.get(key(x,y));
      if(inB(x,y)&&!blocksLight(x,y)){const i=y*S.w+x,v=d<=l.r?2:1;if(g[i]<v)g[i]=v;}
      if(d>=l.r+extra)continue;
      for(const [dx,dy] of (SET.hex?HXD[y&1]:[[1,0],[-1,0],[0,1],[0,-1]])){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(dist.has(k)||!inB(nx,ny)||blocksLight(nx,ny))continue;dist.set(k,d+1);q.push([nx,ny]);}
    }
  }
  _lc={sig,grid:g,S};return g;
}
function cellLight(x,y){if(!SET.darkRules||!inB(x,y))return 2;return lightGrid()[y*S.w+x];}

/* По цели в темноте можно действовать только с соседней клетки (кроме ночного зрения). */

/* Завеса: облако радиуса r вокруг клетки; кто внутри, тот виден и доступен только с соседней клетки, и сам действует только на соседей. Ночное зрение не помогает. */
function cellVeiled(x,y){if(!S.veils)return false;for(const v of S.veils)if((SET.hex?hd(v.x,v.y,x,y):Math.max(Math.abs(v.x-x),Math.abs(v.y-y)))<=v.r)return true;return false;}

/* Отдельная проверка Недоверия для баффа по области: накладывающий против базовой защиты + той же характеристики цели, ничья — провал. */

const MAIN3=['str','dex','int'];
function mainKey(u){let b='str';for(const s of MAIN3)if(stat(u,s)>stat(u,b))b=s;return b;}

const DEXSTR=()=>SET.statModel==='dexstr';
function roleKey(u,s,role){if(s!=='main')return s;if(DEXSTR())return role==='atk'?'dex':'str';return mainKey(u);}
function stat(u,s){

  const rg=u.effects&&u.effects.length?getEff(u,'rage'):null;

  for(const f of u.fract){if(f.startsWith('arm')&&s==='str')v-=5;if(f.startsWith('leg')&&s==='dex')v-=5;}
  if(V2()){const hs=partSt(u,'head');if(hs&&s==='cha')v-=2*hs;}else if(u.wounds&&!rg)for(const ar in u.wounds){const p=WPEN[u.wounds[ar].deg]||0;if(!p)continue;if(ar.startsWith('arm')&&s==='str')v-=p;else if(ar.startsWith('leg')&&s==='dex')v-=p;else if(ar==='head'&&(s==='int'||s==='cha'))v-=p;}
  if(u.disorder){const f=disForm(u);if(f){const P=DISP[u.disorder];if(P.stat===s&&P.sp)v-=P.sp[f-1];}}
  return v;
}
function addEff(u,type,extra={},dur=2){u.effects=u.effects.filter(e=>e.type!==type);u.effects.push({type,end:S.round+Math.max(1,dur)-1,...extra});}

const EFF_RU={shake:'Тряска',vuln:'Уязвимость',cloud:'Затуманенный разум',cover:'Прикрытие',bound:'Вязка',blind:'Ослепление',inspire:'Воодушевление',mark:'Слабое место',taunt:'Насмешка',psalm:'Псалом стойкости',dread:'Глас',ditty:'Песенка',prone:'сбит с ног',rage:'Ярость',evade:'Ускользание',snare:'Капкан'};

function defFx(u){if(!u.effects||!u.effects.length)return[];const m=[];const ps=effMag(u,'psalm');if(ps)m.push({l:'Псалом стойкости',v:ps});const ev_=effMag(u,'evade');if(ev_)m.push({l:'Ускользание',v:ev_});const pr=effMag(u,'prone');if(pr)m.push({l:'сбит с ног',v:-pr});const rg=getEff(u,'rage');if(rg)m.push({l:'Ярость',v:-(rg.defP||0)});return m;}

/* Удар исподтишка: цель рядом с другим союзником атакующего, или атакующий в темноте (цель без ночного зрения), или в Завесе. */

  const up=act.sneak&&sneakOk(att,def);

const SQ3=Math.sqrt(3);

const WOUND_AT=8,BLEED_AT=5,WPEN=[0,0,2,3,5];
const AREAS=['head','torso','armL','armR','legL','legR'];
const AREA_RU={head:'голова',torso:'тело',armL:'левая рука',armR:'правая рука',legL:'левая нога',legR:'правая нога'};
const WDEG_RU=['','обычная','серьёзная','тяжёлая','ампутация'];
const vital=ar=>ar==='head'||ar==='torso';
function woundPenTxt(ar,deg){if(V2()){const s=Math.min(3,Math.max(0,deg-1));if(!s)return 'только кровотечение';if(ar==='head')return `−${2*s} к Харизме`;if(ar==='torso')return s>=3?'из захвата самому не вырваться':`−${2*s} к освобождению из захвата`;if(ar.startsWith('arm'))return s>=3?'рука не действует':`−${2*s} к действиям этой рукой`;return s>=3?'паралич ноги: −2 гекса, −8 к уклонению':`−${s} гекс. скорости, −${2*s} к уклонению`;}const p=WPEN[deg];if(!p)return '';if(ar.startsWith('arm'))return `−${p} к Силе`;if(ar.startsWith('leg'))return `−${p} к Ловкости`;if(ar==='head')return `−${p} к Интуиции и Харизме`;return '';}
/* Удар: фактический урон 8+ — рана (с ней приходит стартовый стак), 5–7 или клинки Филина — один стак кровотечения. */
function hitBleed(def,act,dmg){
  if(PAIN())return null;

  return null;
}
function addWound(u,ar,wanted=1,bleeding=true){
  if(PAIN()){
    if(!ar)ar=pick(AREAS);const w=u.wounds[ar];if(w&&w.deg>=4&&!vital(ar))return false;

    u.wounds[ar]={deg,open:bleeding,bleeding:!!bleeding,age:0};
    if(S.stat)S.stat.wounds=(S.stat.wounds||0)+1;
    if(deg>=4&&vital(ar)){ev(`✝ ${uName(u)}: четвёртая рана головы/корпуса`);downUnit(u);return true;}
    ev(`🩹 ${uName(u)}: ${AREA_RU[ar]}, ${WDEG_RU[deg]} ${bleeding?'открытая':'закрытая'} рана${w&&w.open?' (повторно)':''}`);

  }
  const w=u.wounds[ar];

  const deg=!w?1:w.open?Math.min(4,w.deg+1):w.deg;

/* Начало своего хода: открытая рана даёт +1 стак; обычная закрывается в начале 3-го хода, серьёзная — 4-го (сначала закрытие). */
function tickWounds(u){
  if(PAIN()){
    const closed=[];for(const ar in u.wounds){const w=u.wounds[ar];if(!w.open)continue;w.age=(w.age||0)+1;
      if((w.deg===1&&w.age>=3)||(w.deg===2&&w.age>=4)){w.open=false;closed.push(AREA_RU[ar]);}}
    if(closed.length)ev(`${uName(u)}: закрылись сами — ${closed.join(', ')}`);
    refreshBleed(u);return;
  }
  const closed=[];let add=0;
  for(const ar in u.wounds){const w=u.wounds[ar];if(!w.open)continue;w.age++;
    if((w.deg===1&&w.age>=3)||(w.deg===2&&w.age>=4)){w.open=false;closed.push(AREA_RU[ar]);continue;}
    add++;}
  if(closed.length)ev(`${uName(u)}: рана закрылась — ${closed.join(', ')}`);
  if(add){u.bleed+=add;ev(`🩸 ${uName(u)}: открытые раны +${add} к кровотечению, стаков ${u.bleed}`);}
}
const openWounds=t=>Object.entries(t.wounds||{}).filter(([,w])=>w.open);

function careNeed(t){let n=t.bleed*(t.bleed+1)/2;for(const [,w] of openWounds(t))n+=w.deg>=3?6:w.deg===2?Math.max(1,4-w.age):Math.max(1,3-w.age);return n;}
function doBandage(u,t,a){

/* Проклятия Ведьмы: Уязвимость против базовой защиты + Интуиции цели (как атака: ничья — провал), Затуманенный разум — проверка против сложности. */
/* Проклятия и «метки»: d20 + характеристика против сложности или против базовой защиты + Интуиции цели (vs:'def', ничья — провал). */

function curseOdds(u,t,a){const st=a.stat||'int',m=stat(u,st)+sum(rollMods(u)),vs=a.vs==='def',dc=vs?bdefOf(t)+stat(t,'int'):(a.dc||14),c=[0,0,0,0];for(let r=1;r<=20;r++){const d=r+m-dc;c[d>=10?3:d>=5?2:(vs?d>=1:d>=0)?1:0]++;}return{dc,p:c.map(x=>x/20)};}

  if(!c.dg.ok){log(html,'atk');return;}

  if(PAIN())refreshBleed(t);
  html+=`<div class="ld">⌊Интуиция ${stat(u,'int')}${c.dg.t>1?' × '+fmtN(MULT[c.dg.t]):''} / ${fmtN(a.K||2.5)}⌋ = ${p0} пункт.: снято стаков ${rm}${closed.length?', закрыты: '+closed.join(', '):''}${eased.length?', залечены: '+eased.join(', '):''}${pts>0?`, не понадобилось ${pts}`:''}. HP не восстанавливается</div>`;
  log(html,'atk');fxText(t,'залечено','heal');
}

function adLeft(d){if(AP3())return (d.od||0)+(dexFree(d)?1:0);return (d.adr==null?1:d.adr)+(V2()&&SET.strDef&&stat(d,'dex')>=6?1:0)-(d.adUsed||0);}

function adOutlook(att,act,def,total,amv){
  const pas=passive(def,act),dNow=attackDegree(total-pas),dmgNow=dNow.t?dmgOf(att,act,def,dNow.t):0;

async function onEndTurn(){

/* ================= ИИ ================= */
async function runSideAI(side){
  const us=alive(side).sort((a,b)=>stat(b,'dex')-stat(a,'dex'));
  for(const u of us){if(u.down||S.over)continue;S.sel=u.id;render();await sleep(220);await aiTurn(u);}
}
async function aiTurn(u){
  const g=GEN;u._ai=u._ai||{};let n=0;
  const keep=Math.min(u.od,aiKeep(u));u.od-=keep;
  try{
  while(!u.down&&!S.over&&n++<10){
    if(u.od<=0&&!okAct(u,'knifeExtra')&&!okAct(u,'stepback'))break;
    const did=await aiStep(u);
    if(g!==GEN)throw CANCEL;
    if(!did)break;
    render();await sleep(240);
  }
  }finally{u.od+=keep;}

}
async function aiStep(u){

  if(PAIN()&&u.painState==='threshold'){
    if(okAct(u,'bandage')&&canTarget(u,A.bandage,u)&&needsCare(u))return await perform(u,'bandage',u);
    if(okAct(u,'move')&&await aiRetreat(u,null,true))return true;
    if(okAct(u,'painShout'))return await perform(u,'painShout');
    return false;
  }
  if(V2()){if(u.prone&&okAct(u,'standup'))return await perform(u,'standup');if(hasEff(u,'lasso')&&!hasEff(u,'snare')&&!u.grabbedBy&&okAct(u,'escape')&&(lassoPart(u)==='armR'||!foes.some(f=>near1(u,f))))return await perform(u,'escape');}

    const off=u.acts.filter(id=>A[id]&&['attack','grab'].includes(A[id].kind)&&okAct(u,id));
    const st=bestStrike(u,off);
    if(st&&(A[st.id].kind!=='grab'||Math.random()<.4))return await perform(u,st.id,st.t);
    if(okAct(u,'breakbind'))return await perform(u,'breakbind');
    return st?await perform(u,st.id,st.t):false;
  }
  if(u.moveOnly){const main=primaryAttack(u);const t=main&&nearestFoe(u,foes,main);return t?await aiApproach(u,main,t):false;}
  if(u.guilt&&u.guilt.stage==='go'){const c=guiltCell(u,byId(u.guilt.id));if(c&&await performMove(u,c.x,c.y))return true;u.guilt=null;}
  if(u.guilt&&u.guilt.stage==='band'){if(await perform(u,'bandage',byId(u.guilt.id)))return true;u.guilt.stage='stay';}
  if(obsessLock(u)){
    let best=null;
    for(const id of u.acts){
      if(!isArea(id)||!okAct(u,id,true)||!areaHasTarget(u,id))continue;
      const a=A[id];let v=0,t=null;
      if(a.kind==='arc'){const av=arcValue(u,id);v=av?av.v:0;t=av&&av.cell;}
      else if(AREA_BUFF.has(id)){const R=a.radius||2;v=friends(u).filter(o=>cheb(u,o)<=R).reduce((n,o)=>n+(foes.some(f=>cheb(o,f)<=2)?1.5:.5),0);}

  // Насмешка Шута: ударить насмешника, иначе попытаться приблизиться.
  const tn=getEff(u,'taunt');
  if(tn){const j=byId(tn.by);if(j&&!j.down&&u.od>0){
    let best=null;for(const id of u.acts){const a=A[id];if(!a||!['attack','grab'].includes(a.kind)||!okAct(u,id)||!canTarget(u,a,j))continue;const E=a.kind==='grab'?2:hitCalc(u,a,j).Eact/Math.max(1,a.cost);if(!best||E>best.E)best={id,E};}

    return false;
  }}
  let did=await (AI[u.ai]||AI[T[u.tpl].ai]||AI.pStd||AI.dumb)(u,foes);

  if(!did&&!u.counter&&!u.down&&!S.over){const ids=u.acts.filter(id=>A[id]&&A[id].kind==='attack');const st=bestStrike(u,ids);if(st)did=await perform(u,st.id,st.t);}
  return did;
}
/* Общее для всех ИИ: перевязка, если кровотечение и открытые раны обойдутся дороже удара; бросок факела, если свои стоят в темноте рядом с врагом. */
function aiSupport(u,foes){

    let best=null;for(const o of [u,...friends(u)]){if(!canTarget(u,A.bandage,o))continue;const n=careNeed(o)+(PAIN()&&o.painState==='threshold'?3:0);if(n>=2&&(!best||n>best.n))best={n,t:o};}

function aiTorchCell(u,foes){

  for(const a of darkAllies)for(const c of cellsOf(a))addC(c.x,c.y);

  if(!cand.length)return null;
  const units=S.units.filter(o=>!o.down),before=new Map(units.map(o=>[o.id,unitLight(o)]));

/* Куда ускользнуть: без соседних врагов, лучше — откуда можно стрелять. */
function evadeCell(u,foes){const dist=bfs(u,{max:speedOf(u)});let best={x:u.x,y:u.y,sc:-99};const bow=u.acts.find(id=>A[id]&&A[id].ranged);

function owlHideCell(u,foes){
  const sp=speedOf(u),dist=bfs(u,{max:sp});let best=null;

/* Филин по приоритетам (опция): ослеплён — бьёт ослепившего, пока не спадёт; иначе гасит все факелы на стенах уровня, потом на полу, потом бьёт носителя факела, потом случайного героя. */

  const strike=async t=>{
    if(!t||t.down)return false;
    if(okAct(u,'blades')&&canTarget(u,A.blades,t))return await perform(u,'blades',t);
    if(okAct(u,'move')&&!canTarget(u,A.blades,t)&&await aiApproach(u,'blades',t))return true;
    return false;
  };

  if(bl){const b=byId(bl.by);if(b&&!b.down&&b.side!==u.side){if(await strike(b))return true;return okAct(u,'shriek')?await perform(u,'shriek'):false;}}

    const lit=S.torches.filter(t=>t.lit&&!!t.floor===floor);if(!lit.length)continue;

    const cells=[];for(const t of lit)for(const [dx,dy] of [[0,0],...nbrDirs(t.x,t.y)]){const x=t.x+dx,y=t.y+dy;const o=unitAt(x,y);if(isFloor(x,y)&&(!o||o===u)&&torchReach({x,y},t))cells.push({x,y});}

/* Позиция поддержки: рядом с союзниками, в радиусе голоса, но не вплотную к врагам. */
async function aiSupportPos(u,foes,R,wantFoes){
  if(!okAct(u,'move')||u._ai.pos)return false;u._ai.pos=true;
  const allies=friends(u),sp=speedOf(u),dist=bfs(u,{max:sp});let best=null;
  const eng=allies.filter(a=>foes.some(f=>near1(a,f)));
  const score=c=>eng.filter(a=>cheb(c,a)<=R).length*2+allies.filter(a=>cheb(c,a)<=R).length+(wantFoes?foes.filter(f=>cheb(c,f)<=2&&cheb(c,f)>1).length*1.2:0)-foes.filter(f=>near1(c,f)).length*4-foes.filter(f=>cheb(c,f)<=3).length*.8-(eng.length?0:Math.min(...allies.map(a=>cheb(c,a)),9)*.3);

}
function primaryAttack(u){return u.acts.find(id=>A[id]&&A[id].kind==='attack'&&!A[id].extra&&A[id].fixed==null)||null;}
const weakest=l=>l.slice().sort((a,b)=>a.hp-b.hp)[0];
function arcValue(u,id){let best=null;for(const c of ringCells(u)){const ts=arcTargets(u,c);if(!ts.length)continue;const v=ts.reduce((s,t)=>s+(t.side===u.side?-1:1)*hitCalc(u,A[id],t).E,0);if(!best||v>best.v)best={cell:c,v,n:ts.length};}return best;}
function singleValue(u,id,n){const ts=targetsFor(u,id);if(!ts.length)return 0;return Math.max(...ts.map(t=>hitCalc(u,A[id],t).E))*n;}
function threat(f,u){const id=primaryAttack(f);return id?hitCalc(f,A[id],u).Eact*2:0;}
function foeDist(u,dist,f,id){
  let best=Infinity;
  for(const [k,v] of dist){const [x,y]=unkey(k);if(v.d<best&&canTarget(u,A[id],f,posOf(u,x,y)))best=v.d;}
  return best===Infinity?100+cheb(u,f):best;
}
function nearestFoe(u,foes,id,bias){

  for(const f of foes){const v=foeDist(u,dist,f,id)-(bias?bias(f):0)+Math.random()*.01;if(!best||v<best.v)best={f,v};}

function bestStrike(u,ids,bonus){

  return best;
}
/* План пути с препятствиями: двери открываются (1 ОД), Страж ломает стены и решётки (1 ОД за клетку). */
function planPath(u,goal){
  const smash=u.acts.includes('smash');
  const start=key(u.x,u.y),best=new Map([[start,{c:0,p:null}]]),open=[[0,u.x,u.y]];
  const cost=(x,y)=>{let extra=0;const s=sz(u);for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++){const cx=x+dx,cy=y+dy;if(!inB(cx,cy))return null;const o=unitAt(cx,cy);if(o&&o!==u)return null;if(isWall(cx,cy)){const d=doorAt(cx,cy);if(d&&!d.locked)extra+=1;else if(smash)extra+=1;else return null;}}return 1+extra;};

}

  if(i===0){

      const d=doorAt(c.x,c.y);
      if(d&&!d.locked&&okAct(u,'door')&&validCell(u,A.door,c.x,c.y))return await perform(u,'door',c);

/* Хрупкий герой (Хельга) при прочих равных встаёт рядом с Конрадом, чтобы тот мог прикрыть. */
function guardAdj(u,c){if(!AP3()||!(T[u.tpl]||{}).fragile)return false;return friends(u).some(o=>o!==u&&!o.down&&(T[o.tpl]||{}).guardian&&cheb(c,o)===1);}

async function aiApproachCells(u,cells){

  async owl(u,foes){
    if(SET.owlAI==='rules')return await owlRules(u,foes);
    /* Ударил и остался ОД — гасит соседний полезный факел или улетает в темноту, туда, где до него дотянется меньше героев. */
    if(u._once&&u._once.blades&&!SET.owlTwice&&SET.owlAI==='hunt'){
      if(okAct(u,'douse')){const t=S.torches.find(t=>t.lit&&torchReach(u,t)&&foes.some(f=>!f.nv&&lightDist(f,t)<=(SET.torchR||(SET.hex?3:TORCH_R))+1));if(t)return await perform(u,'douse',t);}
      if(SET.zoc&&!u._ai.flown&&foes.some(f=>near1(u,f))&&okAct(u,'darkjump')){const cs=jumpCells(u,A.darkjump).map(c=>({c,sc:-foes.filter(f=>cheb(c,f)<=speedOf(f)+1).length*1.2+(Math.min(...foes.map(f=>cheb(c,f)))>=2?2:0)})).sort((a,b)=>b.sc-a.sc);if(cs.length){u._ai.flown=true;return await perform(u,'darkjump',cs[0].c);}}
      if(okAct(u,'move')&&!u._ai.flown){u._ai.flown=true;const c=owlHideCell(u,foes);if(c)return await performMove(u,c.x,c.y);}
      return okAct(u,'shriek')?await perform(u,'shriek'):false;
    }
    /* Сначала гасит свет, который освещает героев (ближний — сразу, достижимый за ход — подлетает), потом бьёт носителя факела, потом остальных. */
    if(u.acts.includes('douse')&&okAct(u,'douse')){
      const useful=S.torches.filter(t=>t.lit).map(t=>({t,v:foes.filter(f=>!f.nv&&lightDist(f,t)<=(SET.torchR||(SET.hex?3:TORCH_R))+1).length})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
      const near=useful.find(o=>torchReach(u,o.t));
      if(near)return await perform(u,'douse',near.t);
      const canStrike=okAct(u,'blades')&&(foes.some(f=>near1(u,f))||(u.od>=2&&[...bfs(u,{max:speedOf(u)})].some(([k])=>{const [x,y]=unkey(k);return foes.some(f=>near1(posOf(u,x,y),f));})));
      if(useful.length&&u.od>=2&&okAct(u,'move')&&!canStrike){
        const dist=bfs(u,{max:speedOf(u)});let best=null;
        for(const o of useful)for(const [dx,dy] of [[0,0],...nbrDirs(o.t.x,o.t.y)]){const x=o.t.x+dx,y=o.t.y+dy,v=dist.get(key(x,y));if(v&&v.d>0&&torchReach(posOf(u,x,y),o.t)&&(!best||o.v>best.v||(o.v===best.v&&v.d<best.d)))best={x,y,d:v.d,v:o.v};}
        if(best)return await performMove(u,best.x,best.y);
      }
    }
    if(!okAct(u,'blades'))return okAct(u,'shriek')?await perform(u,'shriek'):false;
    const adj=foes.filter(f=>near1(u,f));
    if(adj.length){const t=adj.find(f=>f.torch)||adj.slice().sort((a,b)=>(passive(a)-passive(b))||(a.hp-b.hp))[0];return await perform(u,'blades',t);}
    const bearers=foes.filter(f=>f.torch),pool=bearers.length?bearers:foes;
    const t=nearestFoe(u,pool,'blades',f=>darkPen(f)?2:0);if(t&&await aiApproach(u,'blades',t))return true;
    return okAct(u,'shriek')?await perform(u,'shriek'):false;
  },
  async pcKnight(u,foes){

  async pcWitch(u,foes){

    if(okAct(u,'cloud')){
      const best=foes.filter(f=>canTarget(u,A.cloud,f)&&!hasEff(f,'cloud')&&f.hp>=12).sort((a,b)=>thr(b)*b.hp-thr(a)*a.hp)[0];

        .map(f=>({f,ok:1-curseOdds(u,f,A.vuln).p[0],eng:allies.filter(a=>near1(a,f)).length})).filter(o=>o.ok>=.35)

    if(okAct(u,'move')&&!u._ai.pos){
      /* Позиция для стрельбы: клетка в пределах хода, откуда видна цель, как можно дальше от врагов (не ближе 2). */
      u._ai.pos=true;const sp=speedOf(u),dist=bfs(u,{max:sp});let best=null;

        if(!foes.some(f=>canTarget(u,A.firebolt,f,c)))continue;const sc=Math.min(md,3)*2-v.d*.2;if(!best||sc>best.sc)best={x,y,sc};}
      if(best)return await performMove(u,best.x,best.y);

  async pcInquisitor(u,foes){

  async pcJester(u,foes){

function drawFloor(){

  if(hasEff(u,'evade'))b.push(['💨','ускользание']);
  if(hasEff(u,'snare'))b.push(['⛓','в капкане']);

  if(u.guilt)b.push([DIS_ICON.guilt,u.guilt.stage==='go'?'идёт к союзнику':u.guilt.stage==='band'?'перевязать союзника':'остаётся рядом']);
  if(hasEff(u,'shake'))b.push([DIS_ICON.fear,'Тряска']);

function renderHL(){
  if(!S||S.sim)return;
  const cells=$('#hl').children,cls=new Array(S.w*S.h).fill('');
  const add=(x,y,c)=>{if(inB(x,y))cls[y*S.w+x]+=' '+c;};
  const addU=(o,c)=>{for(const p of cellsOf(o))add(p.x,p.y,c);};
  const u=selUnit();
  if(S.editor){for(let i=0;i<cls.length;i++)cls[i]=' ed';}
  else if(u&&S.act&&canControl(u)){
    const a=A[S.act];
    if(a.kind==='move'){
      const sp=speedOf(u),dist=bfs(u,{max:sp*Math.min(2,u.od)});
      for(const [k,v] of dist){if(!v.d)continue;const [x,y]=unkey(k);add(x,y,v.d<=sp?'mv1':'mv2');if(SET.zoc&&zocPreview(u,pathTo(dist,x,y)).length)add(x,y,'zw');}
      if(S.hover){const hk=key(S.hover.x,S.hover.y);if(dist.has(hk)&&dist.get(hk).d>0){for(const [x,y] of pathTo(dist,S.hover.x,S.hover.y))add(x,y,'path');addU(posOf(u,S.hover.x,S.hover.y),'path');}}
    }else if(a.kind==='arc'){
      for(const c of ringCells(u))add(c.x,c.y,'arcpick');
      if(S.hover&&cheb(u,S.hover)===1&&!inFoot(u,S.hover.x,S.hover.y))for(const c of arcCells(u,S.hover.x,S.hover.y))if(adjOk(u,c))add(c.x,c.y,'arc');
    }else if(a.kind==='pair'){const ops=pairOptions(u);for(const p of ops)for(const t of p)addU(t,'tgt');if(S.hover){const ht=unitAt(S.hover.x,S.hover.y);const p=ht&&ops.find(p=>p.includes(ht));if(p)for(const t of p)addU(t,'arc');}}
    else if(a.kind==='torch'){for(const t of S.torches)if(validTorch(u,a,t))add(t.x,t.y,'tgt');}
    else if(a.kind==='throw'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validThrow(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validThrow(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='flare'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validFlare(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validFlare(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='jump'){for(const c of jumpCells(u,a))add(c.x,c.y,'rng');if(S.hover&&validJump(u,a,S.hover))add(S.hover.x,S.hover.y,'tgt');}
    else if(a.kind==='veil'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)if(validVeil(u,a,{x,y}))add(x,y,'rng');if(S.hover&&validVeil(u,a,S.hover))for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)add(S.hover.x+dx,S.hover.y+dy,'arc');}
    else if(a.kind==='trap'){for(const c of trapCells(u))add(c.x,c.y,'tgt');}
    else if(a.kind==='flash'){for(const c of fireSources())if(validFlash(u,c)){add(c.x,c.y,'tgt');}if(S.hover&&validFlash(u,S.hover))for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=hd(S.hover.x,S.hover.y,x,y);if(d<=3&&isFloor(x,y)&&fireLine(S.hover,{x,y}))add(x,y,d<=1?'arc':'rng');}}
    else if(a.kind==='step'){for(const c of stepCells(u))add(c.x,c.y,'mv1');}
    else if(a.kind==='evade'){for(const [k,v] of bfs(u,{max:speedOf(u)})){const [x,y]=unkey(k);add(x,y,v.d?'mv1':'path');}}
    else if(a.kind==='door'||a.kind==='smash'){for(const c of ringCells(u))if(validCell(u,a,c.x,c.y))add(c.x,c.y,'tgt');}
    else if(['objectStrike','objectPush'].includes(a.kind)){for(const c of ringCells(u))if(canTerrainAct(u,S.act,c))add(c.x,c.y,'tgt');}
    else{
      if(a.ranged){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=cheb(u,{x,y});if(d>=(a.noAdj?2:1)&&d<=a.range&&isFloor(x,y)&&los(u,{x,y},u).ok)add(x,y,'rng');}}
      else if((a.reach||1)>1&&a.kind==='attack'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const d=cheb(u,{x,y});if(d>=1&&d<=a.reach&&isFloor(x,y)&&(d===1?adjOk(u,{x,y}):reachClear(u,{x,y},u)))add(x,y,'rng');}}

      for(const t of S.units)if(canTarget(u,a,t))addU(t,['cover','buff','swap','bandage','heal','order','ordnow','ordback'].includes(a.kind)?'ally':'tgt');
    }
  }

function canControl(u){return !!u&&!u.down&&!S.over&&!S.busy&&!S.editor&&u.side===S.phase&&isHuman(u.side);}
function actState(u,id){
  const a=A[id];
  if(id==='escape'&&!u.grabbedBy&&!hasEff(u,'snare')&&!hasEff(u,'lasso'))return{show:false};
  if(id==='unlasso'&&!(V2()&&lassoTarget(u)))return{show:false};
  if(id==='standup'&&!u.prone)return{show:false};
  if(!V2()&&['push','prep','prepPush','standup'].includes(id))return{show:false};
  if(id==='throwHeld'&&!u.torch)return{show:false};
  if(id==='breakbind'&&!hasEff(u,'bound'))return{show:false};
  if(id==='unbind'&&!u.binding)return{show:false};
  if(id==='door'&&!Object.keys(S.doors).length)return{show:false};
  if(id==='swap'&&(sz(u)>1||!friends(u).length))return{show:false};
  if(id==='knifeExtra'&&!(PAIN()?u.pain>=Math.max(1,u.maxPain-2):u.hp<A.knifeExtra.hpBelow))return{show:false};
  if(id==='relight')return{show:false};
  if(id==='douse'&&!S.torches.length)return{show:false};
  let why=null;
  const bound=hasEff(u,'bound'),cdR=a.cd?((u.cd||{})[id]||0):0;
  if(S.over)why='бой окончен';
  else if(u.side!==S.phase)why='сейчас ход другой стороны';
  else if(!isHuman(u.side))why='управляет ИИ';
  else if(S.busy)why='подождите';
  else if(a.cost>u.od)why=`нужно ${a.cost} ОД`;
  else if(cdR>S.round)why=`перезарядка: снова в раунде ${cdR}`;
  else if(u.moveOnly&&a.kind!=='move')why='вырвался из Вязки: до конца хода только движение';
  else if(!reqOk(u,id))why=`нужна ${Object.entries(a.req).map(([s,v])=>STAT_RU[s]+' '+v).join(', ')}`;
  else if(a.kind==='move'&&bound)why='под Вязкой';
  else if(a.kind==='move'&&u.grabbedBy)why='в захвате';
  else if(a.kind==='move'&&u.hold)why='удерживает цель';
  else if(ATTACK_KINDS.includes(a.kind)&&u.binding)why='держит Вязку: атаки недоступны';
  else if(ATTACK_KINDS.includes(a.kind)&&bound&&!a.offhand&&!a.ranged&&!((a.rolls||1)>1))why='оружие связано';
  else if(a.kind==='smash'&&bound)why='оружие связано';
  else if(a.kind==='grab'&&u.hold)why='уже удерживает цель';
  else if(a.kind==='bind'&&u.binding)why='уже держит Вязку';
  else if(u.grabbedBy&&a.atk==='dex')why='в захвате: способности на Ловкости недоступны';
  else if(a.needLoad&&!u.loaded)why='арбалет разряжен';
  else if(id==='reload'&&u.loaded)why='уже заряжен';
  else if(id==='knifeExtra'&&u.extraUsed)why='уже использован в этом ходу';
  else if(a.once&&u._once&&u._once[id]&&!(id==='blades'&&SET.owlTwice))why='только один раз за ход';
  else if(id==='shriek'&&shriekTargets(u).length<a.minT)why=`рядом ${shriekTargets(u).length} из ${a.minT} нужных героев`;
  else if(a.kind==='throw'&&!(u.torches>0))why='факелов в запасе нет';
  else if(a.ammo&&!((u.ammo||{})[id]>0))why='запас кончился';
  else if(a.kind==='trap'&&!(u.traps>0))why='капканов не осталось';
  else if(a.kind==='step'&&!u._atk)why='сначала атакуйте в этот ход';
  else if(['move','dash','step'].includes(a.kind)&&hasEff(u,'snare'))why='в капкане';
  else if(a.kind==='bandage'&&!(u.bandages>0))why='бинтов не осталось';
  else if(a.kind==='bandage'&&!hasTargets(u,id))why='нет кровотечения и открытых ран рядом';

function editorClick(x,y){
  const k=key(x,y),u=unitAt(x,y)||S.units.find(o=>inFoot(o,x,y));
  const clearCell=()=>{S.walls.delete(k);delete S.doors[k];delete S.bars[k];delete S.terrain[k];S.torches=S.torches.filter(t=>!(t.x===x&&t.y===y));};
  if(S.etool.startsWith('terrain')||S.etool.startsWith('height')){
    if(S.etool==='heightUp')S.heightMap[k]=Math.min(6,(S.heightMap[k]||0)+1);
    else if(S.etool==='heightDown')S.heightMap[k]=Math.max(-6,(S.heightMap[k]||0)-1);
    else if(S.etool==='terrainErase')delete S.terrain[k];
    else{const type=Object.keys(BATTLE_TERRAIN).find(k=>k.toLowerCase()===S.etool.slice(7).toLowerCase());if(BATTLE_TERRAIN[type]&&(!u||!BATTLE_TERRAIN[type].solid)){clearCell();placeTerr(x,y,type);}}
    S.lv=(S.lv||0)+1;drawFloor();drawLight(performance.now());render();return;
  }
  switch(S.etool){
    case 'unit':{
      if(u){S.sel=u.id;break;}
      const n=mkUnit(S.etpl,S.eside,x,y);
      if(footFree(n,x,y)){nameUnit(n,S.units);S.units.push(n);S.sel=n.id;}else{UID--;}
      break;}
    case 'erase':if(u){S.units=S.units.filter(o=>o!==u);if(S.sel===u.id)S.sel=null;}break;
    case 'moveu':if(S.emove!=null){const m=byId(S.emove);if(m&&footFree(m,x,y)){m.x=x;m.y=y;}S.emove=null;}else if(u){S.emove=u.id;S.sel=u.id;}break;
    case 'wall':if(!u){clearCell();S.walls.add(k);}break;
    case 'floor':clearCell();break;
    case 'torch':{const t=torchAt(x,y);if(t)S.torches=S.torches.filter(o=>o!==t);else if(!u){delete S.doors[k];delete S.bars[k];S.walls.add(k);S.torches.push({x,y,lit:true});}break;}
    case 'door':{const d=S.doors[k];if(d){if(d.open&&u)break;d.open=!d.open;if(d.open)d.locked=false;}else if(!u){clearCell();S.doors[k]={open:false,locked:false};}break;}
    case 'lock':{const d=S.doors[k];if(d){d.locked=!d.locked;if(d.locked)d.open=false;}else if(!u){clearCell();S.doors[k]={open:false,locked:true};}break;}
    case 'bars':if(!u){if(S.bars[k])delete S.bars[k];else{clearCell();S.bars[k]={shoot:false};}}break;
    case 'barsShoot':if(S.bars[k])S.bars[k].shoot=!S.bars[k].shoot;else if(!u){clearCell();S.bars[k]={shoot:true};}break;
  }
  S.lv=(S.lv||0)+1;drawFloor();drawLight(performance.now());render();
}
function toggleEditor(on){

}

const IMMEDIATE=['self','circle','escape','aura','breakbind','unbind','standup','prep','unlasso'];
function onAction(id){
  const u=selUnit();if(!canControl(u))return;
  const a=A[id],st=actState(u,id);if(!st.ok)return;
  if(IMMEDIATE.includes(a.kind)){run(()=>perform(u,id));return;}
  S.act=S.act===id?null:id;hideTip();render();
}
async function run(fn){
  closeCtx();
  S.busy=true;S.act=null;hideTip();render();
  const g=GEN;
  try{await fn();}catch(e){if(e!==CANCEL)console.error(e);}
  if(g===GEN){S.busy=false;render();}
}
function cellFromEvent(e){const c=e.target.closest&&e.target.closest('.c');if(!c)return null;return{x:+c.getAttribute('data-x'),y:+c.getAttribute('data-y')};}
function onCellClick(e){
  if(SIMULATING)return;
  const p=cellFromEvent(e);if(!p)return;
  if(S.editor){editorClick(p.x,p.y);return;}
  if(S.busy)return;
  const u=selUnit(),t=unitAt(p.x,p.y);
  if(S.act&&canControl(u)){
    const a=A[S.act],id=S.act;
    if(a.kind==='move'){const dist=bfs(u,{max:speedOf(u)*Math.min(2,u.od)});const v=dist.get(key(p.x,p.y));if(v&&v.d>0){run(()=>performMove(u,p.x,p.y));return;}}
    else if(a.kind==='arc'){if(cheb(u,p)===1&&!inFoot(u,p.x,p.y)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='pair'){if(t&&pairOptions(u).some(q=>q.includes(t))){run(()=>perform(u,id,t));return;}}
    else if(a.kind==='wswap'){run(()=>perform(u,id));return;}
    else if(a.kind==='torch'){const tc=torchAt(p.x,p.y);if(tc&&validTorch(u,a,tc)){run(()=>perform(u,id,tc));return;}}
    else if(a.kind==='throw'){if(validThrow(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='flare'){if(validFlare(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='jump'){if(validJump(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='veil'){if(validVeil(u,a,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='trap'){if(validTrap(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='flash'){if(validFlash(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='step'){if(stepCells(u).some(c=>c.x===p.x&&c.y===p.y)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='evade'){if(evadeOk(u,p)){run(()=>perform(u,id,p));return;}}
    else if(a.kind==='door'||a.kind==='smash'){if(validCell(u,a,p.x,p.y)){run(()=>perform(u,id,p));return;}}
    else if(['objectStrike','objectPush'].includes(a.kind)){if(canTerrainAct(u,id,p)){run(()=>perform(u,id,p));return;}}
    else if(t&&canTarget(u,a,t)){run(()=>perform(u,id,t));return;}
  }
  if(S.act){S.act=null;closeCtx();render();return;}
  openCtx(e,p,t||S.units.find(o=>inFoot(o,p.x,p.y)));
}
function onCellHover(e){

  if(!S.hover||S.hover.x!==p.x||S.hover.y!==p.y){S.hover=p;renderHL();}

}

  <li>Поле — гексагоны вершиной вверх, нечётные ряды сдвинуты на полгекса. У каждого гекса 6 соседей; все расстояния, радиусы, досягаемость и свет считаются шагами по гексам. Стена занимает целый гекс.</li>
  <li>Сквозь союзников и противников проходить нельзя. Обмен местами с соседним союзником — 1 ОД.</li>
  <li>Дверь: открыть или закрыть — 1 ОД, нужно стоять рядом; занятую дверь не закрыть; запертые двери бывают; Страж их ломает. Решётки пропускают свет, но не проход; бить сквозь решётку — свойство конкретной решётки.</li>
  <li>Оружие с досягаемостью 2 не бьёт через персонажа, только если он стоит в единственном гексе посередине; если средних гексов два, удар проходит, когда свободен хотя бы один. Линия видимости — так же: если линия идёт по ребру между гексами, видно, когда свободен хотя бы один из двух.</li>
  <li>Свет: факел освещает все гексы в 3 шагах. Глухие стены и закрытые двери его не пропускают; открытые проёмы, решётки и персонажи пропускают. Зоны нескольких источников объединяются. Полутьмы нет: гекс либо на свету, либо в темноте. Погасший факел заново не зажечь.</li>
  <li>Филин видит в темноте: темнота ему не мешает ни атаковать, ни защищаться, ни выбирать цели.</li>
  <li>Факелы: у каждого героя по 2, у противников, кроме Филина и Стража, тоже по 2. Факел можно бросить на пол.</li>
  <li>Рана: фактический урон 8+ за один удар (после брони). Удар на 5–7 даёт один стак кровотечения без раны; за один удар — не больше одного стака (клинки Филина тоже дают один). Степени: обычная → серьёзная → тяжёлая → ампутация. Новая рана по открытой области повышает степень и заново запускает срок, по закрытой — та же степень. Обычная закрывается в начале 3-го хода после получения, серьёзная — 4-го; тяжёлая и ампутация сами не закрываются. Четвёртая рана головы или тела, пока область открыта, — смерть.</li>
  <li>Кровотечение: рана сразу даёт 1 стак, каждая открытая рана — ещё 1 в начале каждого своего хода. В конце раунда каждый стак наносит 1 урона, затем снимается 1 стак.</li>
  <li>Штрафы ран: обычная — без штрафа, серьёзная −2, тяжёлая −3, ампутация −5. Рука — к Силе, нога — к Ловкости, голова — к Интуиции и Харизме. Штраф остаётся и после закрытия раны.</li>
  <li>Перевязка: 1 ОД, один бинт = 3 лечебных пункта: сначала по 1 на каждый стак кровотечения, затем по 1 на открытую рану. Работает и на тяжёлой ране.</li>
  <li>Ведьма. Огненная стрела: попадание и урон от Интуиции. Уязвимость: d20 + Интуиция против базовой защиты + Интуиции цели; по степени −Интуиция / 2,5 к пассивной и активной защите на 2 хода цели, броня не меняется, повтор обновляет срок и не складывается. Затуманенный разум: d20 + Интуиция против 14; по степени −Интуиция / 2,5 к атакам и способностям цели на 2 хода цели.</li></ul>
  <h3>Баланс на пятерых героев</h3><ul>

  <li><span class="pend"></span>Исключения из «урон от Силы»: оружие на Ловкость (изогнутый клинок Странника, кинжалы Разбойницы и Шута) — попадание и урон от Ловкости; урон лука задаёт стрела, лук умножает его (сейчас короткий лук ×1).</li>
  <li><span class="pend"></span>Монах (Харизма, Интуиция). Обезболивание (бывшее Залечивание; в бою без ограничений, вне боя — раз на комнату, эффект только в этой комнате): пункты снимают стаки, закрывают раны и смягчают закрытые раны на ступень, HP не лечит. Псалом стойкости: + к защите союзникам рядом. Громовой глас: урон голосом по площади без брони. Голос действует сквозь стены.</li>

  <li><span class="pend"></span>Странник с Востока (Ловкость, Интуиция). Изогнутый клинок; Рывок — подбежать и ударить за 1 ОД; Удар в точку — онемение, следующий ход с 1 ОД; Отскок на клетку после атаки без ОД; Завеса — облако, сквозь которое видно и бьют только вплотную.</li>

async function runSim(n){

  try{

      S=buildState(reparse?parseScenario(real.scn):snap);S.sim=true;S.stat={wounds:0,torch:0,band:0};initCombat();
      await phaseLoop();
      res[S.over||'draw']++;res.rounds+=S.round;if(S.round>8)res.long++;res.wounds+=S.stat.wounds;
      const pcs=S.units.filter(u=>u.side==='pc'),dn=pcs.filter(u=>u.down).length;if(S.over==='pc'&&!dn)res.allAlive++;if(pcs.length&&dn===pcs.length)res.allDead++;

    <p>Средняя длина боя: <b>${fmtN(res.rounds/n)}</b> раунда, дольше 8 раундов: ${p('long')} · ран за бой: ${fmtN(res.wounds/n)} · ничьих ${p('draw')} · ${n} боёв · ${SCN[real.scn]?SCN[real.scn].name:'своя расстановка'}</p>
    <table><tr><th>Боец</th><th>Выжил</th><th>${PAIN()?'Остаток до предела Боли':'Остаток HP'}</th></tr>${Object.values(res.units).map(r=>`<tr><td><span class="nm ${r.side}">${r.name}</span>${r.n<n?` <span class="dim">(в ${pct(r.n/n)} боёв)</span>`:''}</td><td>${pct(r.alive/r.n)}</td><td>${r.alive?fmtN(r.hp/r.alive)+' / '+r.max:'—'}</td></tr>`).join('')}</table>`;
  render();
}

      ${cols.map(([f,l])=>`<td>${numIn(k,f,f==='will'?t[f]:(t[f]??({baseDef:6,size:1,adr:1,bandages:0,torches:0,traps:0,bow:1}[f]??0)),l)}</td>`).join('')}
      <td class="der" id="dd-${k}">${d.def}</td><td class="der" id="ds-${k}">${d.sp}</td><td class="der" id="dm-${k}">${d.main}</td>
      <td style="text-align:center"><input type="checkbox" data-t="${k}" data-f="nightVision" ${t.nightVision?'checked':''} aria-label="Ночное зрение: ${esc(t.name)}"></td>
      <td style="text-align:center"><input type="checkbox" data-t="${k}" data-f="resist" ${t.resist?'checked':''} aria-label="Стойкость босса: ${esc(t.name)}"></td>
      <td><select data-t="${k}" data-f="ai" aria-label="Поведение ИИ">${Object.entries(AI_RU).map(([a,l])=>`<option value="${a}" ${t.ai===a?'selected':''}>${l}</option>`).join('')}</select></td>
      <td>${DEF_T[k]?`<button type="button" data-rt="${k}" title="Вернуть значения свода">↺ свод</button>`:`<button type="button" data-delt="${k}">Удалить</button>`}</td></tr>
      <tr class="wrow"><td colspan="27" class="wcell"><span class="dim">Оружие и способности:</span> ${chips}<select data-add="${k}" aria-label="Добавить оружие или способность: ${esc(t.name)}"><option value="">+ добавить</option>${avail.map(id=>`<option value="${id}">${esc(A[id].name)}</option>`).join('')}</select></td></tr>`;
  }
  return h+`</tbody></table></div><div class="drow"><button type="button" id="newChar">+ Новый персонаж</button><label for="bdefAll">Базовая защита всем</label><input type="number" class="ni" id="bdefAll" value="6" style="width:58px"><button type="button" id="bdefAllGo">Задать</button></div>
    <p class="dim">Модель: ${DEXSTR()?'«Ловкость/Сила» — защита = база + Ловкость + щит, попадание от Ловкости, урон от Силы':'«основная характеристика» — защита = база + наибольшая из Силы, Ловкости, Интуиции + щит; атака и урон от неё же'}. Переключается в «Настройках правил». Скорость = 3 + 1 за каждые 2 Ловкости сверх 5.${SET.party.includes('witch')?'':' Ведьма не входит в группу по умолчанию.'}</p>`;
}
function fieldVal(a,f){if(f==='reqStr')return a.req&&a.req.str||0;return a[f]==null?AF_DEF[f]:a[f];}
function dmgPreview(a,id){
  if(a.fixed!=null)return `Урон: фиксированный ${a.fixed}${a.knock?', ×2 при ударе о препятствие':''}`;
  const owner=Object.keys(T).find(k=>T[k].acts.includes(id));
  const u=owner?tmpUnit(owner):{base:{str:7,dex:7,int:7,cha:3},fract:[],effects:[],disorder:null};
  if(a.base!=null)return `${owner?esc(T[owner].name):'Пример'}: стрела ${a.base}${owner&&(T[owner].bow||1)!==1?' × лук '+fmtN(T[owner].bow):''} → урон ${[1,2,3].map(t=>rawDmg(u,a,t)).join(' / ')} до брони`;
  const dk=roleKey(u,a.dmg,'dmg'),s=stat(u,dk),l=STAT_RU[dk];
  return `${owner?esc(T[owner].name):'Пример'} (${l} ${s}): урон ${[1,2,3].map(t=>rawDmg(u,a,t)).join(' / ')} до брони`;
}
function weapCard(id){
  const a=A[id],owners=Object.keys(T).filter(k=>T[k].acts.includes(id)).map(k=>esc(T[k].name));
  const fs=AF.filter(f=>f.on(a,id)).map(f=>{
    const v=fieldVal(a,f.k),fid=`af-${id}-${f.k}`;
    if(f.t==='bool')return `<label class="fb" for="${fid}"><input type="checkbox" id="${fid}" data-a="${id}" data-f="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
    if(f.t==='stat')return `<label for="${fid}">${f.l}</label><select id="${fid}" data-a="${id}" data-f="${f.k}">${Object.entries(STAT_OPT).map(([s,l])=>`<option value="${s}" ${v===s?'selected':''}>${l}</option>`).join('')}</select>`;
    return `<label for="${fid}">${f.l}</label><input type="number" id="${fid}" class="ni" step="${f.step||1}" data-a="${id}" data-f="${f.k}" value="${v==null?'':v}"${f.t==='numOpt'?' placeholder="нет"':''}>`;
  }).join('');
  return `<div class="wcard" data-card="${id}"><div class="wh"><input type="text" class="ti" data-a="${id}" data-f="name" value="${esc(a.name)}" aria-label="Название">${DEF_A[id]?`<button type="button" data-ra="${id}" title="Вернуть значения свода">↺</button>`:`<button type="button" data-dela="${id}">Удалить</button>`}</div>
    <div class="wk">${KIND_RU[a.kind]||a.kind} · ${owners.length?owners.join(', '):'ни у кого'}${a.pending?'<div class="pend">требует утверждения</div>':''}</div>
    <div class="wf">${fs}</div>${isDmgKind(a)?`<div class="wd" id="wd-${id}">${dmgPreview(a,id)}</div>`:''}</div>`;
}
function weapTab(){
  const ids=Object.keys(A).filter(id=>!['move','escape'].includes(id)&&!BUILTIN.includes(id));
  const atk=ids.filter(id=>ATTACK_KINDS.includes(A[id].kind)),oth=ids.filter(id=>!ATTACK_KINDS.includes(A[id].kind));
  return `<h3>Оружие, атаки и захваты</h3><div class="drow"><button type="button" id="newWeap">+ Новое оружие</button><span class="dim">Новое оружие появится в списке «+ добавить» у персонажей. Фиксированный урон: оставьте поле пустым, чтобы урон считался по K.</span></div>
    <div class="wgrid">${atk.map(weapCard).join('')}</div><h3>Способности</h3><div class="wgrid">${oth.map(weapCard).join('')}</div>`;
}
function ioTab(){
  return `<p>Скопируйте текст, чтобы сохранить вариант баланса или переслать его. Чтобы загрузить вариант, вставьте текст в поле и нажмите «Загрузить».</p>
    <textarea id="ioText" rows="14" spellcheck="false" aria-label="Значения персонажей и оружия">${esc(JSON.stringify({v:DATA_V,T,A}))}</textarea>
    <div class="drow"><button type="button" id="ioCopy">Скопировать</button><button type="button" class="primary" id="ioLoad">Загрузить из поля</button><button type="button" id="ioReset">Вернуть всё к своду</button><span id="ioMsg" class="dim" role="status"></span></div>`;
}
function setAF(id,f,i){
  const a=A[id];if(!a)return false;
  if(i.type==='checkbox'){a[f]=i.checked;if(f==='ranged'&&i.checked){if(a.range==null)a.range=3;if(a.noAdj==null)a.noAdj=true;if(!a.fx)a.fx='bolt';}return true;}
  if(i.tagName==='SELECT'){a[f]=i.value;return true;}
  if(f==='name'){a.name=i.value.trim()||a.name;return true;}
  if(i.value===''){if(f==='fixed'){a.fixed=null;return true;}if(f==='reqStr'){a.req=null;return true;}i.value=fieldVal(a,f)??'';return false;}
  let v=parseFloat(String(i.value).replace(',','.'));if(isNaN(v)){i.value=fieldVal(a,f)??'';return false;}
  if(f==='K')v=Math.max(.25,v);
  if(['cost','rolls','reach','range','dur','radius','minT','gdmg','cdmg','hpBelow','fixed','pierce','mag','cd','dc','off','crit','turns','defPen','pierceMin','pts','base','ammo','sneak','trip','tdmg','atkB','strB','defP'].includes(f))v=Math.max(['rolls','reach','range','dur','minT','turns'].includes(f)?1:0,Math.round(v));
  if(f==='reqStr'){a.req=v>0?{str:Math.round(v)}:null;return true;}
  if(f==='penalty')v=Math.round(v);
  a[f]=v;i.value=v;return true;
}
function markActOwners(id){for(const [k,t] of Object.entries(T))if(t.acts.includes(id))DATA_DIRTY.add(k);}
function bindDataTab(){
  const box=$('#dataBody'),msg=t=>{const m=$('#ioMsg');if(m)m.textContent=t;};
  box.querySelectorAll('[data-t][data-f]').forEach(i=>i.onchange=()=>{
    const k=i.dataset.t,f=i.dataset.f,t=T[k];if(!t)return;
    if(i.type==='number'){
      if(i.value===''){if(f==='will')t.will=null;else{i.value=t[f]??({baseDef:6,size:1,adr:1,bandages:0,torches:0,traps:0,bow:1}[f]??0);return;}}
      else{const v=parseFloat(String(i.value).replace(',','.'));if(isNaN(v)){i.value=t[f]??'';return;}t[f]=f==='hp'?Math.max(1,Math.round(v)):f==='size'?Math.min(2,Math.max(1,Math.round(v))):f==='bow'?Math.max(.25,Math.round(v*4)/4):['adr','bandages','torches','traps'].includes(f)?Math.max(0,Math.round(v)):Math.round(v);i.value=t[f];}
    }else if(i.type==='checkbox')t[f]=i.checked;
    else if(f==='glyph')t.glyph=i.value.trim().slice(0,2)||'?';
    else if(f==='name'){t.name=i.value.trim()||t.name;i.value=t.name;}
    else t[f]=i.value;
    DATA_DIRTY.add(k);saveData();updDerived(k);
  });
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=b.dataset.rm;T[k].acts=T[k].acts.filter(x=>x!==b.dataset.id);DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-add]').forEach(sel=>sel.onchange=()=>{const k=sel.dataset.add,id=sel.value;if(!id)return;const acts=T[k].acts.filter(x=>x!=='escape');acts.push(id,'escape');T[k].acts=acts;DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{const k=b.dataset.rt;T[k]=clone(DEF_T[k]);T[k].acts=T[k].acts.filter(id=>A[id]);DATA_DIRTY.add(k);saveData();renderDataTab();});
  box.querySelectorAll('[data-delt]').forEach(b=>b.onclick=()=>{const k=b.dataset.delt;delete T[k];DATA_DIRTY.add(k);saveData();renderDataTab();});
  const ba=$('#bdefAllGo');if(ba)ba.onclick=()=>{const v=Math.round(parseFloat(String($('#bdefAll').value).replace(',','.')));if(isNaN(v))return;for(const [k,t] of Object.entries(T)){t.baseDef=v;DATA_DIRTY.add(k);}saveData();renderDataTab();$('#bdefAll').value=v;};
  const nc=$('#newChar');if(nc)nc.onclick=()=>{const k='c'+Date.now().toString(36);T[k]={name:'Новый боец',glyph:'?',side:'en',str:5,dex:5,int:5,cha:3,will:0,hp:12,armor:0,shield:0,baseDef:6,speed:3,torches:2,bandages:0,acts:['move','improv','throwTorch','escape'],ai:'dumb'};saveData();renderDataTab();const tw=$('#dataBody .tblwrap');if(tw)tw.scrollTop=tw.scrollHeight;};
  box.querySelectorAll('[data-a][data-f]').forEach(i=>i.onchange=()=>{
    const id=i.dataset.a,f=i.dataset.f;if(!setAF(id,f,i))return;saveData();
    if(i.type==='checkbox'||i.tagName==='SELECT'||REFRESH_FIELDS.includes(f)||f==='name'){const c=box.querySelector(`[data-card="${id}"]`);if(c){c.outerHTML=weapCard(id);bindDataTab();}}
    else{const w=document.getElementById('wd-'+id);if(w)w.innerHTML=dmgPreview(A[id],id);}
    if(S&&!S.sim)render();
  });
  box.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{const id=b.dataset.ra;A[id]=clone(DEF_A[id]);saveData();renderDataTab();render();});
  box.querySelectorAll('[data-dela]').forEach(b=>b.onclick=()=>{const id=b.dataset.dela;markActOwners(id);for(const t of Object.values(T))t.acts=t.acts.filter(x=>x!==id);delete A[id];saveData();renderDataTab();render();});
  const nw=$('#newWeap');if(nw)nw.onclick=()=>{const id='w'+Date.now().toString(36);A[id]={name:'Новое оружие',cost:1,kind:'attack',atk:'main',dmg:'main',K:2,reach:1};saveData();renderDataTab();const c=box.querySelector(`[data-card="${id}"] input`);if(c){c.focus();c.select();}};
  const cp=$('#ioCopy');if(cp)cp.onclick=()=>{const ta=$('#ioText');const ok=()=>msg('Скопировано');const fb=()=>{ta.focus();ta.select();msg('Текст выделен — нажмите Ctrl+C');};try{navigator.clipboard.writeText(ta.value).then(ok,fb);}catch(e){fb();}};
  const ld=$('#ioLoad');if(ld)ld.onclick=()=>{try{mergeData(JSON.parse($('#ioText').value));DATA_ALL=true;saveData();msg('Загружено. Бой начнётся заново, когда вы закроете окно.');render();}catch(e){msg('Не удалось загрузить: '+(e.message||'текст не похож на сохранённые значения'));}};
  const rs=$('#ioReset');if(rs)rs.onclick=()=>{mergeData({T:{},A:{}});DATA_ALL=true;saveData();$('#ioText').value=JSON.stringify({v:DATA_V,T,A});msg('Все значения возвращены к своду. Бой начнётся заново, когда вы закроете окно.');render();};
}
function applyTemplates(){
  if(!DATA_DIRTY.size&&!DATA_ALL){render();return;}
  const all=DATA_ALL,dirty=new Set(DATA_DIRTY);DATA_DIRTY.clear();DATA_ALL=false;
  const fix=list=>list.filter(u=>T[u.tpl]).map(u=>{
    if(!all&&!dirty.has(u.tpl))return u;
    const t=T[u.tpl],old=u.tname||t.name,suffix=u.name.startsWith(old)?u.name.slice(old.length):'';
    Object.assign(u.base,{str:t.str,dex:t.dex,int:t.int,cha:t.cha});
    Object.assign(u,{size:t.size||1,adr:t.adr==null?1:t.adr,nv:!!t.nightVision,resist:!!t.resist,traps:t.traps||0,ammo:ammoOf(t),wield:weaponsOf(t)[0]||null,bow:t.bow||1,freeReload:!!t.freeReload,bandages:t.bandages||0,torches:Math.max(0,(t.torches||0)-(u.torch?1:0)),maxHp:PAIN()?(t.painLimit||5):t.hp,hp:PAIN()?(t.painLimit||5):t.hp,pain:0,maxPain:t.painLimit||5,painState:"active",deathSteps:0,exhaust:t.exhaust||0,armor:t.armor,shield:t.shield||0,bdef:t.baseDef==null?6:t.baseDef,will:t.will,glyph:t.glyph,acts:t.acts.filter(id=>A[id]),ai:t.ai,name:t.name+suffix,tname:t.name});
    return u;
  });
  if(S.editor){S.units=fix(S.units);render();log('<div class="lb">Значения персонажей обновлены</div>','sys');return;}
  const snap=S.initial;snap.units=fix(snap.units);startGame(snap);
  log('<div class="lb">Значения персонажей обновлены, бой начат заново</div>','sys');
}

/* ================= ЗАПУСК ================= */
function startGame(snap){
  GEN++;closePrompt(null);hideTip();
  S=buildState(snap);
  $('#log').innerHTML='';$('#fx').innerHTML='';$('#banner').hidden=true;$('#banner').dataset.closed='';$('#banner').dataset.over='';
  $('#btnEditor').classList.remove('on');
  layoutBoard();
  const sc=SCN[S.scn];
  log(`<div class="lb">Сценарий: ${sc?sc.name:'своя расстановка'}</div>`,'sys');
  initCombat();
  const first=S.units.find(u=>u.side==='pc');S.sel=first?first.id:null;
  render();
  S.busy=true;
  phaseLoop().catch(e=>{if(e!==CANCEL)console.error(e);});
}
function loadScenario(id){$('#scn').value=id;startGame(parseScenario(id));}
function restart(){if(SIMULATING)return;startGame(S.initial);}

function init(data){
  loadData();
  $('#scn').innerHTML=Object.entries(SCN).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  $('#scn').onchange=e=>{if(!SIMULATING)loadScenario(e.target.value);};
  $('#btnRestart').onclick=restart;
  $('#btnEditor').onclick=()=>toggleEditor(!S.editor);
  $('#btnOdds').onclick=openOdds;$('#btnSim').onclick=openSim;$('#btnRules').onclick=openRules;$('#btnNotes').onclick=openNotes;$('#btnData').onclick=()=>{if(!SIMULATING)openData();};
  $('#btnClearLog').onclick=()=>{$('#log').innerHTML='';S.log=[];};
  initUI2();
  $('#modal').onclick=e=>{if(e.target.id==='modal'&&!SIMULATING)closeModal();};
  const hl=$('#hl');
  hl.addEventListener('click',onCellClick);
  $('#toks').addEventListener('click',onCellClick);$('#toks').addEventListener('mousemove',onCellHover);
  hl.addEventListener('mousemove',onCellHover);
  hl.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderHL();});
  hl.addEventListener('contextmenu',e=>{e.preventDefault();if(S.act){S.act=null;hideTip();render();}});
  document.addEventListener('keydown',e=>{
    if(!$('#prompt').hidden)return;
    if(e.key==='Escape'){if(CTX){closeCtx();return;}if(!$('#modal').hidden&&!SIMULATING){closeModal();return;}if(S.act){S.act=null;hideTip();render();}return;}
    if(!$('#modal').hidden||e.target.matches('input,select'))return;
    if(e.key==='Enter'){onEndTurn();e.preventDefault();return;}
    if(e.key==='Tab'&&S&&!S.editor&&!S.busy&&isHuman(S.phase)){const hs=alive(S.phase).filter(o=>o.od>0);if(hs.length){const k=hs.findIndex(o=>o.id===S.sel);S.sel=hs[(k+(e.shiftKey?hs.length-1:1))%hs.length].id;S.act=null;render();}e.preventDefault();return;}
    if(/^[1-9]$/.test(e.key)){const b=$('#acts').querySelectorAll('[data-act]')[+e.key-1];if(b)b.click();}
  });
  document.addEventListener('pointerdown',e=>{if(CTX&&!e.target.closest('#ctxm')&&!e.target.closest('#board'))closeCtx();});
  window.addEventListener('scroll',()=>{if(CTX&&window.innerWidth>700)closeCtx();},true);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S)layoutBoard();},120);});
  requestAnimationFrame(loop);
  const lay=data&&data.layout&&data.layout.units?data.layout:null;
  if(lay&&data.bal===BAL_V){$('#scn').value=lay.scn||'guard';startGame(lay);}
  else if(lay&&SCN[lay.scn]){loadScenario(V2()?'dummies':lay.scn);log('<div class="lb">Баланс обновился: сценарий собран заново с новыми значениями</div>','sys');}
  else loadScenario(V2()?'dummies':'guard');
  if(OLD_DATA)log('<div class="lb">Сохранённые в браузере значения персонажей и оружия сброшены: баланс обновился. Теперь браузер хранит только ваши изменения, и новые значения свода до них доходят</div>','sys');
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({bal:BAL_V,layout:S?JSON.parse(JSON.stringify(S.initial)):null}));}catch(e){}}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(init);else init((hot&&hot.data)||{});
</script>
